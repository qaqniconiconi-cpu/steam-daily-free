name: Update Games (Stable API Engine)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run Stable API Processor
        run: |
          cat <<EOF > processor.py
          import requests
          import json
          import re
          import time
          import hashlib
          import random
          import string
          import os
          import yaml
          from datetime import datetime

          # Reddit 接口要求必须有特殊的 User-Agent，否则报 429
          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ETalienBot/1.0', 'Accept-Language': 'zh-CN,zh;q=0.9'}
          API_BASE = 'system.et-api.com'

          def post_update_with_sign(filename, data):
              method, path, ver = 'POST', '/v1/update/steam-daily-free', '1773281024'
              ua = HEADERS['User-Agent']
              for attempt in range(3):
                  nonce = ''.join(random.choices(string.ascii_letters + string.digits, k=32))
                  ts = str(int(time.time()))
                  sig = hashlib.sha256(f"{method}{API_BASE}{path}?ver={ver}&nonce={nonce}&ts={ts}&ua={ua}".encode('utf-8')).hexdigest()
                  headers = {'sig': sig, 'ts': ts, 'nonce': nonce, 'ver': ver, 'User-Agent': ua, 'filename': filename, 'Content-Type': 'application/json'}
                  try:
                      res = requests.post(f"https://{API_BASE}{path}", headers=headers, json=data, timeout=20)
                      if res.status_code == 200: 
                          print(f"✅ 上传 {filename} 成功! (共 {len(data) if isinstance(data, list) else len(data.get('to_paid',[]))+len(data.get('free_weekend',[]))} 条)")
                          return
                  except Exception as e: 
                      time.sleep(3)
              print(f"❌ 上传 {filename} 最终彻底失败!")

          # ==========================================
          # 核心源 1: Epic 官方后端 API
          # ==========================================
          def fetch_epic_games():
              print("📡 正在获取 Epic 官方数据...")
              active, upcoming = [], []
              url = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN"
              try:
                  res = requests.get(url, headers=HEADERS, timeout=10).json()
                  for item in res.get('data', {}).get('Catalog', {}).get('searchStore', {}).get('elements', []):
                      promos = item.get('promotions')
                      if not promos: continue
                      slug = item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug') or "free"
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      
                      # 本周免
                      if promos.get('promotionalOffers'):
                          offers = promos['promotionalOffers'][0]['promotionalOffers']
                          if offers and offers[0].get('discountSetting', {}).get('discountPercentage') == 0:
                              active.append({
                                  "zh_title": item['title'], "thumbnail": img, 
                                  "end_date": offers[0]['endDate'], "platform": "Epic Games", 
                                  "epic_slug": slug, "short_description": "Epic 官方限时免费"
                              })
                      # 下周预告
                      elif promos.get('upcomingPromotionalOffers'):
                          offers = promos['upcomingPromotionalOffers'][0]['promotionalOffers']
                          if offers:
                              upcoming.append({
                                  "zh_title": item['title'], "image": img, 
                                  "start_date": offers[0]['startDate'], "end_date": offers[0]['endDate'], 
                                  "platform": "Epic Games", "epic_slug": slug, "short_description": "即将开启免费领取"
                              })
              except Exception as e: print(f"⚠️ Epic API 解析失败: {e}")
              return active, upcoming

          # ==========================================
          # 核心源 2 & 3: Reddit JSON 与 GamerPower API
          # ==========================================
          def fetch_steam_ids_from_apis():
              print("📡 正在获取 Steam 社区及聚合 API 数据...")
              steam_ids = set()
              
              # 1. Reddit r/FreeGameFindings (提取带有 [Steam] 的帖子)
              try:
                  res = requests.get("https://www.reddit.com/r/FreeGameFindings/new.json?limit=50", headers=HEADERS, timeout=15)
                  if res.status_code == 200:
                      posts = res.json().get('data', {}).get('children', [])
                      for post in posts:
                          data = post['data']
                          title = data.get('title', '').lower()
                          url = data.get('url', '')
                          # 只要标题带 [steam] 且包含 store.steampowered.com/app 的链接
                          if '[steam]' in title and 'store.steampowered.com/app/' in url:
                              m = re.search(r'app/(\d+)', url)
                              if m: steam_ids.add(m.group(1))
              except Exception as e: print(f"⚠️ Reddit API 失败: {e}")

              # 2. GamerPower API (提取平台为 Steam 的喜加一)
              try:
                  res = requests.get("https://www.gamerpower.com/api/giveaways?platform=steam", headers=HEADERS, timeout=15)
                  if res.status_code == 200:
                      for item in res.json():
                          url = item.get('open_giveaway_url', '')
                          # 跟随重定向获取真实 Steam URL
                          act_url = requests.get(url, headers=HEADERS, timeout=5, allow_redirects=True).url
                          m = re.search(r'app/(\d+)', act_url)
                          if m: steam_ids.add(m.group(1))
              except Exception as e: print(f"⚠️ GamerPower API 失败: {e}")

              return steam_ids

          # ==========================================
          # Steam 验真系统 (精准探测折扣与新闻公告)
          # ==========================================
          def verify_steam_app(app_id, forced_info=None):
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res_raw = requests.get(url, headers=HEADERS, timeout=10)
                  if res_raw.status_code == 429 and not forced_info: return None
                  
                  d = {}
                  if res_raw.status_code == 200:
                      res = res_raw.json()
                      if str(app_id) in res and res[str(app_id)]['success']:
                          d = res[str(app_id)]['data']
                  
                  # ⚡ 上帝模式：如果有强制参数，无脑构造放行
                  if forced_info:
                      g_type = forced_info['type']
                      e_date = forced_info['end_date'] or "近期即将转付费"
                      z_title = forced_info.get('name') or d.get('name', f"神秘福利 {app_id}")
                      thumb = d.get('header_image', f"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/{app_id}/header.jpg")
                      return {
                          "steam_id": str(app_id), "zh_title": z_title, "thumbnail": thumb,
                          "short_description": "已通过管理员通道强制核准",
                          "is_100_off": g_type == "100_off", "is_weekend": g_type == "weekend", "end_date": e_date,
                          "type": g_type
                      }

                  if not d or d.get('type') != 'game': return None

                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free_license = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))

                  end_date = "N/A"
                  if price.get('discount_expiration'):
                      end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')

                  if not is_100_off and has_free_license and price.get('final', 0) == 0 and not is_free:
                      is_100_off = True

                  game_type = "unknown"
                  
                  if is_100_off:
                      game_type = "100_off"
                  elif is_free:
                      # ⚡ 重点：它是免费游戏，用官方新闻 API 探测它是不是宣告要收费了
                      keywords = ["转付费", "开始收费", "become paid", "becoming paid", "paid game", "price tag", "pricing"]
                      try:
                          news_url = f"https://api.steampowered.com/ISteamNews/GetNewsForApp/v0002/?appid={app_id}&count=5"
                          items = requests.get(news_url, timeout=5).json().get('appnews', {}).get('newsitems', [])
                          for item in items:
                              text = (item.get('title','') + item.get('contents','')).lower()
                              if any(k in text for k in keywords):
                                  game_type = "to_paid"
                                  end_date = "近期即将转付费"
                                  break
                      except: pass

                  if game_type == "unknown": return None

                  return {
                      "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                      "short_description": d.get('short_description', '').strip().split('。')[0],
                      "is_100_off": game_type == "100_off", "is_weekend": game_type == "weekend", "end_date": end_date,
                      "type": game_type
                  }
              except: return None

          def main():
              active_epic, upcoming_epic = fetch_epic_games()
              steam_ids = fetch_steam_ids_from_apis()
              
              FORCED_ADD = {}
              BLACKLIST = set()
              
              # 读取手动管理菜单 (高容错版)
              if os.path.exists('manager.yml'):
                  try:
                      with open('manager.yml', 'r', encoding='utf-8') as f:
                          mgr = yaml.safe_load(f) or {}
                          print(f"📄 已成功解析 manager.yml")
                          
                          disable_list = mgr.get('disable') or mgr.get('DISABLE') or []
                          if not isinstance(disable_list, list): disable_list = [disable_list]
                          for item in disable_list:
                              m = re.search(r'app/(\d+)', str(item))
                              app_id = m.group(1) if m else str(item).strip()
                              if app_id.isdigit(): BLACKLIST.add(app_id)

                          add_list = mgr.get('add') or mgr.get('ADD') or []
                          if not isinstance(add_list, list): add_list = [add_list]
                          for item in add_list:
                              if isinstance(item, dict):
                                  link = str(item.get('link', item.get('id', '')))
                                  m = re.search(r'app/(\d+)', link)
                                  app_id = m.group(1) if m else link.strip()
                                  if app_id.isdigit():
                                      FORCED_ADD[app_id] = {
                                          "type": item.get('type', 'to_paid'),
                                          "end_date": item.get('end_date', ''),
                                          "name": item.get('name', '')
                                      }
                              else:
                                  link = str(item)
                                  m = re.search(r'app/(\d+)', link)
                                  app_id = m.group(1) if m else link.strip()
                                  if app_id.isdigit():
                                      FORCED_ADD[app_id] = {"type": "to_paid", "end_date": "近期即将转付费", "name": ""}
                  except Exception as e: print(f"⚠️ 解析 manager.yml 失败: {e}")

              # 剔除黑名单
              steam_ids = {sid for sid in steam_ids if sid not in BLACKLIST}
              # 合并强制验证名单
              steam_ids.update(FORCED_ADD.keys())

              print(f"⚖️ 开始验证 {len(steam_ids)} 个 Steam 候选游戏...")
              active_steam, f_to_paid = [], []
              
              for app_id in steam_ids:
                  forced = FORCED_ADD.get(app_id)
                  info = verify_steam_app(app_id, forced)
                  if info:
                      if info['type'] == "100_off":
                          active_steam.append(info)
                          print(f"✨ 喜加一: {info['zh_title']}")
                      elif info['type'] == "to_paid":
                          f_to_paid.append(info)
                          print(f"🔄 转付费入库: {info['zh_title']}")
                  time.sleep(1.5)

              final_active = active_epic + active_steam
              post_update_with_sign("games.json", final_active)
              post_update_with_sign("upcoming.json", upcoming_epic)
              
              # ⚡ 恢复 intel.json 通道，向前端推送转付费游戏
              post_update_with_sign("intel.json", {"to_paid": f_to_paid, "free_weekend": []})

          if __name__ == "__main__": main()
          EOF
          python processor.py
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add *.json || true
          git commit -m "Migrate to Stable APIs & Restore To-Paid Intel" || true
          git push
