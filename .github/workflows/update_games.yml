name: Update Games (ETL Smart Engine)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests

      - name: Run ETL Processor
        run: |
          cat <<EOF > processor.py
          import requests
          import json
          import re
          import time
          import hashlib
          import random
          import string
          import os
          from datetime import datetime

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          API_BASE = 'system.et-api.com'
          DB_FILE = 'steam_db.json' # 本地核心记忆库

          EA_PLAY_BANS = {"1238810", "1238840", "1172470", "1522820", "1238860", "1222680", "1238880", "1238820", "1172380"}
          MANUAL_PAID_IDS = ["3018430", "2366060"] # 强制打标池

          def post_update_with_sign(filename, data):
              method, path, ver = 'POST', '/v1/update/steam-daily-free', '1773281024'
              nonce = ''.join(random.choices(string.ascii_letters + string.digits, k=32))
              ts = str(int(time.time()))
              ua = HEADERS['User-Agent']
              sign_string = f"{method}{API_BASE}{path}?ver={ver}&nonce={nonce}&ts={ts}&ua={ua}"
              sig = hashlib.sha256(sign_string.encode('utf-8')).hexdigest()
              headers = {'sig': sig, 'ts': ts, 'nonce': nonce, 'ver': ver, 'User-Agent': ua, 'filename': filename, 'Content-Type': 'application/json'}
              try:
                  res = requests.post(f"https://{API_BASE}{path}", headers=headers, json=data, timeout=15)
                  if res.status_code == 200: print(f"✅ 上传 {filename} 成功 (共 {len(data) if isinstance(data, list) else len(data.get('to_paid',[]))+len(data.get('free_weekend',[]))} 条)!")
              except Exception as e: print(f"❌ 上传 {filename} 错误: {e}")

          def parse_date_smart(text):
              months = {"jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12}
              best_dt = None
              cn_dates = re.findall(r'(?:(\d{4})年)?(\d{1,2})月(\d{1,2})[日号]?', text)
              if cn_dates:
                  now = datetime.utcnow()
                  for y_str, m_str, d_str in cn_dates:
                      y = int(y_str) if y_str else now.year
                      m, d = int(m_str), int(d_str)
                      if m < now.month - 2 and not y_str: y += 1
                      try: 
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              m1 = re.findall(r'(?:until|ends|before|exp|on|starting|after|as\s+of)\s+([a-zA-Z]{3,})\s+(\d+)', text, re.IGNORECASE)
              for m_str, d_str in m1:
                  m_s = m_str.lower()[:3]
                  if m_s in months:
                      now = datetime.utcnow()
                      y, m, d = now.year, months[m_s], int(d_str)
                      if m < now.month - 2: y += 1
                      try:
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              return best_dt.strftime('%Y-%m-%dT%H:%M:%SZ') if best_dt else "N/A"

          # ==========================================
          # 模块二：官方验真机 (Verification Engine)
          # ==========================================
          def verify_steam_app(app_id):
              if str(app_id) in EA_PLAY_BANS: return {"status": "invalid", "reason": "EA Play 黑名单"}
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res_raw = requests.get(url, headers=HEADERS, timeout=10)
                  if res_raw.status_code == 429: return {"status": "rate_limit"} # 触发限流，保留 pending
                      
                  res = res_raw.json()
                  if str(app_id) not in res or not res[str(app_id)]['success']: return {"status": "invalid", "reason": "API返回失败/无此游戏"}
                  d = res[str(app_id)]['data']
                  
                  if d.get('type') != 'game': return {"status": "invalid", "reason": "不是游戏本体(DLC/音乐等)"}
                  
                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free_license = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))

                  if not is_100_off and has_free_license and price.get('final', 0) == 0 and not is_free:
                      is_100_off = True

                  end_date = "N/A"
                  if price.get('discount_expiration'):
                      end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  
                  if end_date == "N/A":
                      try:
                          h = requests.get(f"https://store.steampowered.com/app/{app_id}?l=english", headers=HEADERS, cookies=COOKIES, timeout=5).text
                          ban = re.search(r'Free to keep when you get it before([^<]+)', h, re.IGNORECASE)
                          if ban: 
                              is_100_off = True
                              dt = parse_date_smart("before " + ban.group(1))
                              if dt != "N/A": end_date = dt
                      except: pass

                  if not (is_free or is_100_off or has_free_license): return {"status": "invalid", "reason": "非免费/非特惠"}

                  keywords = ["转付费", "开始收费", "结束免费", "become paid", "paid game", "pricing", "限免", "free to keep", "恢复原价"]
                  if end_date == "N/A":
                      desc_text = d.get('detailed_description', '') + " " + d.get('short_description', '')
                      if any(k in desc_text.lower() for k in keywords):
                          dt = parse_date_smart(desc_text)
                          end_date = dt if dt != "N/A" else "近期即将转付费"

                  if end_date == "N/A":
                      try:
                          news_url = f"https://api.steampowered.com/ISteamNews/GetNewsForApp/v0002/?appid={app_id}&count=5"
                          items = requests.get(news_url, timeout=5).json().get('appnews', {}).get('newsitems', [])
                          for item in items:
                              if any(k in (item.get('title','') + item.get('contents','')).lower() for k in keywords):
                                  dt = parse_date_smart(item.get('title','') + item.get('contents',''))
                                  end_date = dt if dt != "N/A" else "近期即将转付费"
                                  break
                      except: pass

                  if str(app_id) in MANUAL_PAID_IDS and end_date == "N/A":
                      end_date = "近期即将转付费"

                  game_type = "unknown"
                  if is_100_off: game_type = "100_off"
                  elif has_free_license and not is_100_off and price.get('final', 0) > 0: game_type = "weekend"
                  elif is_free and end_date != "N/A": game_type = "to_paid"
                  else: return {"status": "invalid", "reason": "条件不满足(可能是普通免费游戏)"}

                  return {
                      "status": "valid",
                      "type": game_type,
                      "details": {
                          "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                          "short_description": d.get('short_description', '').strip().split('。')[0],
                          "is_100_off": game_type == "100_off",
                          "is_weekend": game_type == "weekend",
                          "end_date": end_date
                      }
                  }
              except Exception as e: return {"status": "invalid", "reason": f"解析异常: {e}"}

          def main():
              # ==========================================
              # 初始化：加载本地记忆库
              # ==========================================
              db = {}
              if os.path.exists(DB_FILE):
                  try:
                      with open(DB_FILE, 'r', encoding='utf-8') as f: db = json.load(f)
                      print(f"📦 成功加载本地记忆库，包含 {len(db)} 条历史记录")
                  except: pass

              # ==========================================
              # 模块一：情报雷达网 (Discovery Engine)
              # ==========================================
              scraped_ids = set(MANUAL_PAID_IDS)
              print("📡 启动广域雷达网扫描新情报...")
              
              # 自然语言转ID
              for name in ["拾取宝石后意外觉醒了"]:
                  try:
                      res = requests.get(f"https://store.steampowered.com/search/suggest?term={name}&f=games&cc=CN&l=schinese", headers=HEADERS, timeout=5)
                      m = re.search(r'data-ds-appid="(\d+)"', res.text)
                      if m: scraped_ids.add(m.group(1))
                  except: pass

              # 社区 RSS / JSON
              sources = [
                  "https://keylol.com/forum.php?mod=rss&fid=319",
                  "https://www.reddit.com/r/FreeGameFindings/new.json?limit=50",
                  "https://www.reddit.com/r/FreeGamesOnSteam/new.json?limit=50",
                  "https://www.reddit.com/r/GameDeals/new.json?limit=50",
                  "https://www.steamgifts.com/discussions/deals"
              ]
              for s in sources:
                  try:
                      res = requests.get(s, headers=HEADERS, timeout=10)
                      if res.status_code == 200: scraped_ids.update(re.findall(r'app/(\d+)', res.text))
                  except: pass

              # Steam 官方特惠
              for page in range(0, 2):
                  try:
                      search_url = f"https://store.steampowered.com/search/results/?query&start={page*50}&count=50&dynamic_data=&sort_by=_ASC&snr=1_7_7_7000_7&specials=1&infinite=1"
                      res = requests.get(search_url, headers=HEADERS, timeout=10)
                      if res.status_code == 200:
                          blocks = res.json().get('results_html', '').split('data-ds-appid="')
                          for b in blocks[1:]:
                              if "-100%" in b or ">Free<" in b or ">免费<" in b: scraped_ids.add(b.split('"')[0])
                  except: pass

              # 数据去重与入库 (Extract & Load)
              new_pending_count = 0
              for app_id in scraped_ids:
                  if app_id not in db:
                      db[app_id] = {"status": "pending", "added_at": datetime.utcnow().isoformat()}
                      new_pending_count += 1
              print(f"🔍 雷达扫描完毕。发现 {new_pending_count} 个全新未知情报。")

              # ==========================================
              # 模块二：执行验真 (Verification)
              # ==========================================
              pending_ids = [app_id for app_id, data in db.items() if data.get('status') == 'pending']
              print(f"⚖️ 开始验真机作业... 当前待验队列: {len(pending_ids)} 个 (本次最多处理 40 个防封禁)")
              
              for app_id in pending_ids[:40]: # 每次运行最多验证40个，防止429
                  result = verify_steam_app(app_id)
                  if result["status"] == "rate_limit":
                      print("🚨 触发 Steam API 频率限制，暂停本次验真，剩余队列留待下次处理。")
                      break
                  
                  db[app_id] = result
                  if result["status"] == "valid": print(f"✨ 验真通过入库: {app_id} [{result['type']}]")
                  else: print(f"🗑️ 验真驳回(假消息/无效): {app_id} -> {result.get('reason')}")
                  time.sleep(1.5)

              # ==========================================
              # 模块三：时间状态机 (Lifecycle Machine)
              # ==========================================
              print("⏱️ 启动状态机进行生命周期盘点...")
              active_games, f_to_paid, f_weekend = [], [], []
              current_time = datetime.utcnow()
              
              for app_id, data in list(db.items()):
                  if data.get('status') == 'valid':
                      details = data['details']
                      end_date_str = details.get('end_date')
                      
                      is_expired = False
                      if end_date_str != "N/A" and end_date_str != "近期即将转付费":
                          try:
                              dt = datetime.strptime(end_date_str, '%Y-%m-%dT%H:%M:%SZ')
                              if dt < current_time: is_expired = True
                          except: pass
                      
                      # 如果已经过期，更新数据库状态为 expired
                      if is_expired:
                          print(f"⏳ 游戏已过期自动下架: {details.get('zh_title', app_id)}")
                          db[app_id]['status'] = 'expired'
                      else:
                          # 依然活跃，分发给前端
                          g_type = data['type']
                          if g_type == "100_off": active_games.append(details)
                          elif g_type == "to_paid": f_to_paid.append(details)
                          elif g_type == "weekend": f_weekend.append(details)

              # ==========================================
              # Epic Games (因官方接口直接给活跃状态，无需存库)
              # ==========================================
              upcoming_list = []
              epic_urls = ["https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN", "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN"]
              for e_url in epic_urls:
                  try:
                      res = requests.get(e_url, timeout=10).json()
                      for item in res['data']['Catalog']['searchStore']['elements']:
                          promos = item.get('promotions')
                          if not promos: continue
                          slug = item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug') or "free"
                          img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                          
                          if promos.get('promotionalOffers'):
                              offers = promos['promotionalOffers'][0]['promotionalOffers']
                              if offers and offers[0].get('discountSetting', {}).get('discountPercentage') == 0:
                                  active_games.append({"zh_title": item['title'], "thumbnail": img, "end_date": offers[0]['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "Epic 官方限时免费"})
                          elif promos.get('upcomingPromotionalOffers'):
                              offers = promos['upcomingPromotionalOffers'][0]['promotionalOffers']
                              if offers:
                                  upcoming_list.append({"zh_title": item['title'], "image": img, "start_date": offers[0]['startDate'], "end_date": offers[0]['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "即将开启免费领取"})
                      if active_games: break
                  except: continue

              # ==========================================
              # 模块四：API 分发层 (Delivery Engine) & 保存记忆
              # ==========================================
              post_update_with_sign("games.json", active_games)
              post_update_with_sign("upcoming.json", upcoming_list)
              post_update_with_sign("intel.json", {"to_paid": f_to_paid, "free_weekend": f_weekend})

              # 保存数据库变更到本地
              with open(DB_FILE, 'w', encoding='utf-8') as f:
                  json.dump(db, f, ensure_ascii=False, indent=2)
              print("💾 记忆库状态已保存！")

          if __name__ == "__main__": main()
          EOF
          python processor.py
      - name: Commit and Push DB
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add steam_db.json *.json || true
          git commit -m "Auto Update ETL Database [skip ci]" || true
          git push
