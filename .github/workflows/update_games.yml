name: Diagnostic Scraper (No Sign / No Upload)

on:
  workflow_dispatch: # 只允许手动触发，方便调试

jobs:
  debug_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Diagnostic Processor
        run: |
          # ⚡ 使用单引号 'EOF' 防止变量被 shell 提前解析
          cat <<'EOF' > debug_processor.py
          import requests
          import re
          import json

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          def main():
              active_games = []
              print("--- 🟢 开始诊断 Steam 抓取 ---")
              try:
                  # 测试 Steam 官方分类
                  res = requests.get("https://store.steampowered.com/api/featuredcategories/?cc=CN&l=schinese", headers=HEADERS, timeout=10).json()
                  ids = []
                  for cat in res.values():
                      if 'items' in cat: ids.extend([str(item['id']) for item in cat['items']])
                  print(f"找到潜在 Steam ID 数量: {len(ids)}")
              except Exception as e:
                  print(f"❌ Steam 接口请求失败: {e}")

              print("\n--- 🟢 开始诊断 Epic 抓取 ---")
              try:
                  res = requests.get("https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN", headers=HEADERS, timeout=10).json()
                  elements = res['data']['Catalog']['searchStore']['elements']
                  print(f"Epic 接口原始返回数量: {len(elements)}")
                  for item in elements:
                      if item.get('promotions'):
                          active_games.append(item['title'])
              except Exception as e:
                  print(f"❌ Epic 接口请求失败: {e}")

              print("\n--- 📊 抓取结果汇总 ---")
              print(f"当前捕获到的游戏标题列表: {active_games}")

          if __name__ == "__main__": main()
          EOF
          python debug_processor.py
