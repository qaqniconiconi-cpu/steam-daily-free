name: Update Games (Steam Recovery & Header Fix)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests

      - name: Run Smart Processor
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import hashlib
          import time
          import random
          import string
          from datetime import datetime, timedelta

          HOST = 'system.et-api.com'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          HEADERS = {'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'}
          
          def get_signed_headers(method, path):
              ver = "1773281024"
              nonce = ''.join(random.choices(string.ascii_letters + string.digits, k=32))
              ts = str(int(time.time()))
              sign_string = f"{method}{HOST}{path}?ver={ver}&nonce={nonce}&ts={ts}&ua={UA}"
              sig = hashlib.sha256(sign_string.encode('utf-8')).hexdigest()
              return {'sig': sig, 'ts': ts, 'nonce': nonce, 'ver': ver, 'User-Agent': UA}

          def get_steam_details(app_id):
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res = requests.get(url, headers=HEADERS, timeout=15).json()
                  if str(app_id) not in res or not res[str(app_id)]['success']: return None
                  d = res[str(app_id)]['data']
                  price = d.get('price_overview', {})
                  is_free = d.get('is_free', False)
                  discount = price.get('discount_percent', 0)
                  
                  if is_free or discount == 100:
                      end_date = "N/A"
                      if price.get('discount_expiration'):
                          end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                      return {
                          "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                          "short_description": d.get('short_description', '').strip().split('。')[0],
                          "end_date": end_date, "platform": "Steam"
                      }
              except Exception as e:
                  print(f"⚠️ Steam ID {app_id} 详情失败: {e}")
              return None

          def main():
              active_games, upcoming_list = [], []
              steam_ids = set()
              
              print("🔍 正在多渠道扫描 Steam 热点...")
              
              # 渠道 1: Steam 官方分类
              try:
                  res = requests.get("https://store.steampowered.com/api/featuredcategories/?cc=CN&l=schinese", headers=HEADERS, timeout=15).json()
                  for cat in res.values():
                      if 'items' in cat: steam_ids.update([str(item['id']) for item in cat['items']])
                  print(f"✅ 官方渠道获取到 {len(steam_ids)} 个 ID")
              except Exception as e: print(f"❌ 官方渠道扫描失败: {e}")

              # 渠道 2: GamerPower (Steam)
              try:
                  gp = requests.get("https://www.gamerpower.com/api/giveaways?platform=steam", headers=HEADERS, timeout=15).json()
                  gp_count = 0
                  for g in gp:
                      m = re.search(r'app/(\d+)', g.get('open_giveaway_url', ''))
                      if m: 
                          steam_ids.add(m.group(1))
                          gp_count += 1
                  print(f"✅ GamerPower 获取到 {gp_count} 个新 ID")
              except Exception as e: print(f"❌ GamerPower 扫描失败: {e}")

              # 渠道 3: 其乐 Keylol RSS (备用方案)
              try:
                  rss = requests.get("https://keylol.com/forum.php?mod=rss&fid=319", headers=HEADERS, timeout=15).text
                  rss_ids = re.findall(r'app/(\d+)', rss)
                  steam_ids.update(rss_ids)
                  print(f"✅ Keylol 渠道获取到 {len(rss_ids)} 个新 ID")
              except: pass

              print(f"📊 汇总发现 {len(steam_ids)} 个潜在项目，开始深度验证...")
              for sid in steam_ids:
                  info = get_steam_details(sid)
                  if info: 
                      active_games.append(info)
                      print(f"✅ 捕获有效 Steam: {info['zh_title']}")

              # --- Epic 官方 ---
              print("🔍 正在扫描 Epic 官方数据...")
              try:
                  res = requests.get("https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN", headers=HEADERS, timeout=15).json()
                  for item in res['data']['Catalog']['searchStore']['elements']:
                      promos = item.get('promotions')
                      if not promos: continue
                      slug = item.get('productSlug') or "free-games"
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      for node in promos.get('promotionalOffers', []):
                          for offer in node.get('promotionalOffers', []):
                              if offer.get('discountSetting', {}).get('discountPercentage') == 0:
                                  active_games.append({"zh_title": item['title'], "thumbnail": img, "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug})
                      for node in promos.get('upcomingPromotionalOffers', []):
                          for offer in node.get('promotionalOffers', []):
                              upcoming_list.append({"zh_title": item['title'], "image": img, "start_date": offer['startDate'], "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug})
              except Exception as e: print(f"❌ Epic 官方扫描失败: {e}")

              # --- Epic 隐藏雷达 (识别《光明斗士》) ---
              print("🔍 正在扫描 Epic 隐藏雷达...")
              try:
