name: Update Games (Full Auto & Deep Scan)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Global Smart Processor
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import hashlib
          import time
          import random
          import string
          from datetime import datetime, timedelta
          from bs4 import BeautifulSoup

          HOST = 'system.et-api.com'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
          }
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}

          def get_signed_headers(method, path):
              ver = "1773281024"
              nonce = ''.join(random.choices(string.ascii_letters + string.digits, k=32))
              ts = str(int(time.time()))
              ua = HEADERS['User-Agent']
              sign_string = f"{method}{HOST}{path}?ver={ver}&nonce={nonce}&ts={ts}&ua={ua}"
              sig = hashlib.sha256(sign_string.encode('utf-8')).hexdigest()
              return {'User-Agent': ua, 'sig': sig, 'ts': ts, 'nonce': nonce, 'ver': ver}

          def parse_date_smart(text):
              months = {"jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12}
              best_dt = None
              # 1. 匹配标准日期 2026-05-01 或 05/01
              std_dates = re.findall(r'(\d{4})[-/](\d{1,2})[-/](\d{1,2})', text)
              if std_dates:
                  for y, m, d in std_dates:
                      try:
                          dt = datetime(int(y), int(m), int(d), 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass

              # 2. 匹配中文日期
              cn_dates = re.findall(r'(?:(\d{4})年)?(\d{1,2})月(\d{1,2})[日号]?', text)
              if cn_dates:
                  now = datetime.utcnow()
                  for y_str, m_str, d_str in cn_dates:
                      y = int(y_str) if y_str else now.year
                      m, d = int(m_str), int(d_str)
                      if m < now.month - 2 and not y_str: y += 1
                      try: 
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              
              # 3. 匹配英文月日
              m1 = re.findall(r'(?:until|ends|before|on|starting|after|at|by)\s+([a-zA-Z]{3,})\s+(\d+)', text, re.IGNORECASE)
              for m_str, d_str in m1:
                  m_s = m_str.lower()[:3]
                  if m_s in months:
                      now = datetime.utcnow()
                      y, m, d = now.year, months[m_s], int(d_str)
                      if m < now.month - 2: y += 1
                      try:
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              return best_dt.strftime('%Y-%m-%dT%H:%M:%SZ') if best_dt else "N/A"

          def get_steam_details(app_id, old_time="N/A"):
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res = requests.get(url, headers=HEADERS, timeout=10).json()
                  if str(app_id) not in res or not res[str(app_id)]['success']: return None
                  d = res[str(app_id)]['data']
                  
                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free_license = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))

                  end_date = "N/A"
                  if price.get('discount_expiration'):
                      end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  
                  keywords = ["转付费", "收费", "价格调整", "paid", "pricing", "premium", "no longer free", "going paid", "transition"]

                  # 深度扫描新闻：处理类似《宠物怪兽》这种没有折扣过期字段的情况
                  if end_date == "N/A":
                      try:
                          news_url = f"https://api.steampowered.com/ISteamNews/GetNewsForApp/v0002/?appid={app_id}&count=5"
                          items = requests.get(news_url, timeout=5).json().get('appnews', {}).get('newsitems', [])
                          for item in items:
                              content = (item.get('title', '') + item.get('contents', '')).lower()
                              if any(k in content for k in keywords):
                                  dt = parse_date_smart(content)
                                  if dt != "N/A": 
                                      end_date = dt
                                      break
                      except: pass

                  # 判定是否属于转付费或现免
                  is_to_paid = (end_date != "N/A" and (is_free or (has_free_license and price.get('final', 0) == 0)))
                  
                  if not (is_100_off or is_to_paid or (has_free_license and price.get('final', 0) > 0)): return None

                  return {
                      "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                      "short_description": d.get('short_description', '').strip().split('。')[0],
                      "is_100_off": is_100_off,
                      "end_date": end_date,
                      "is_weekend": has_free_license and not is_100_off and price.get('final', 0) > 0,
                      "is_to_paid": is_to_paid and not is_100_off
                  }
              except: return None

          def main():
              ids = set()
              # ⚡ 突破点 1：主动搜索扫描（不依赖 ID，直接搜免费榜）
              for page in range(1, 4):
                  try:
                      search_url = f"https://store.steampowered.com/search/?maxprice=free&sort_by=Released_DESC&page={page}"
                      r = requests.get(search_url, headers=HEADERS, timeout=15)
                      ids.update(re.findall(r'data-ds-appid="(\d+)"', r.text))
                  except: pass

              # 补充原有渠道
              for url in ["https://store.steampowered.com/api/featuredcategories/?cc=CN&l=schinese"]:
                  try:
                      res = requests.get(url, timeout=10).json()
                      for cat in res.values():
                          if 'items' in cat: ids.update([str(item['id']) for item in cat['items']])
                  except: pass

              sources = ["https://keylol.com/forum.php?mod=rss&fid=319", "https://www.gamerpower.com/api/giveaways?platform=steam"]
              for s in sources:
                  try:
                      res = requests.get(s, timeout=15).text
                      ids.update(re.findall(r'app/(\d+)', res))
                  except: pass

              active_games, f_to_paid, f_weekend = [], [], []
              for app_id in ids:
                  info = get_steam_details(app_id)
                  if info:
                      if info.get('is_to_paid'): f_to_paid.append(info)
                      elif info['is_100_off']: active_games.append(info)
                      elif info['is_weekend']: f_weekend.append(info)

              # ⚡ Epic 逻辑完整保留
              upcoming_list = []
              epic_urls = ["https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN", "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN"]
              for e_url in epic_urls:
                  try:
                      res = requests.get(e_url, timeout=10).json()
                      for item in res['data']['Catalog']['searchStore']['elements']:
                          promos = item.get('promotions')
                          if not promos: continue
                          mappings = item.get('catalogNs', {}).get('mappings', [])
                          slug = mappings[0].get('pageSlug') if mappings else (item.get('productSlug') or item.get('urlSlug') or "free-games")
                          img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                          for active_nodes in promos.get('promotionalOffers', []):
                              for offer in active_nodes.get('promotionalOffers', []):
                                  if offer.get('discountSetting', {}).get('discountPercentage') == 0:
                                      active_games.append({"zh_title": item['title'], "thumbnail": img, "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "Epic 官方限时免费"})
                                      break
                          for upcoming_nodes in promos.get('upcomingPromotionalOffers', []):
                              for offer in upcoming_nodes.get('promotionalOffers', []):
                                  upcoming_list.append({"zh_title": item['title'], "image": img, "start_date": offer['startDate'], "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "即将开启免费领取"})
                                  break
                      if active_games: break
                  except: continue

              # Epic 隐藏雷达
              try:
                  gp_epic = requests.get("https://www.gamerpower.com/api/giveaways?platform=epic-games-store", timeout=15).json()
                  for g in gp_epic:
                      title = g.get('title', '')
                      gp_url = g.get('open_giveaway_url')
                      if not gp_url: continue
                      try:
                          actual_url = requests.get(gp_url, timeout=10).url
                          m = re.search(r'store\.epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?p/([^/?#]+)', actual_url)
                          if m:
                              slug = m.group(1)
                              end_date = "N/A"
                              end_str = g.get('end_date')
                              if end_str and end_str != "N/A":
                                  try: end_date = datetime.strptime(end_str, "%Y-%m-%d %H:%M:%S").strftime('%Y-%m-%dT%H:%M:%SZ')
                                  except: pass
                              if end_date != "N/A":
                                  active_games.append({"zh_title": title, "thumbnail": g.get('thumbnail'), "end_date": end_date, "platform": "Epic Games", "epic_slug": slug, "short_description": "Epic 额外赠送/隐藏"})
                      except: pass
              except: pass

              # 数据分发上传
              for fn, data in [("games.json", active_games), ("upcoming.json", upcoming_list), ("intel.json", {"to_paid": f_to_paid, "free_weekend": f_weekend})]:
                  try:
                      headers = get_signed_headers('POST', '/v1/update/steam-daily-free')
                      headers['filename'] = fn
                      headers['Content-Type'] = 'application/json'
                      url = f"https://{HOST}/v1/update/steam-daily-free"
                      requests.post(url, headers=headers, json=data, timeout=15)
                  except: pass

          if __name__ == "__main__": main()
          EOF
          python processor.py
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git add *.json || true
          git commit -m "Full Update with Steam Deep Scan" || true
          git push
