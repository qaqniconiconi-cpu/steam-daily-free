name: Update Games (ETL Smart Engine)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run ETL Processor
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import time
          import os
          import yaml
          import urllib.parse
          from datetime import datetime

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          API_BASE = os.environ.get('API_BASE', 'localhost')
          DB_FILE = 'steam_db.json'

          BLACKLIST = set()
          FORCED_ADD = {}
          FORCED_EPIC = []
          PROCESSED_EPIC_SLUGS = set() # 统一去重池

          # 1. 加载手动管理菜单 (manager.yml)
          if os.path.exists('manager.yml'):
              print("🎛️ 正在同步管理规则...")
              try:
                  with open('manager.yml', 'r', encoding='utf-8') as f:
                      mgr = yaml.safe_load(f) or {}
                      
                      # 处理黑名单
                      dis = mgr.get('disable') or mgr.get('DISABLE') or []
                      for item in (dis if isinstance(dis, list) else [dis]):
                          it = str(item).strip()
                          m_s = re.search(r'app/(\d+)', it)
                          m_e = re.search(r'p/([^/?#]+)', it)
                          if m_s: BLACKLIST.add(m_s.group(1))
                          elif m_e: BLACKLIST.add(m_e.group(1).lower()) # 统一小写去重
                          else: BLACKLIST.add(it.lower())

                      # 处理手动添加/修改规则
                      adds = mgr.get('add') or mgr.get('ADD') or []
                      for item in (adds if isinstance(adds, list) else [adds]):
                          if not isinstance(item, dict): continue
                          link = str(item.get('link', '')).strip()
                          name = str(item.get('name', '')).strip()
                          
                          # 修正日期格式
                          raw_date = item.get('end_date') or item.get('endTime') or ""
                          if isinstance(raw_date, datetime): raw_date = raw_date.strftime('%Y-%m-%dT%H:%M:%SZ')
                          
                          is_epic = 'epicgames.com' in link.lower() or str(item.get('platform')).lower() == 'epic'
                          if is_epic:
                              m_e = re.search(r'p/([^/?#]+)', link)
                              slug = m_e.group(1).lower() if m_e else link.split('/')[-1].lower()
                              FORCED_EPIC.append({
                                  "epic_slug": slug, "zh_title": name, "end_date": str(raw_date),
                                  "type": item.get('type', '100_off'),
                                  "_custom_desc": str(item.get('desc', item.get('description', ''))),
                                  "_custom_thumb": str(item.get('thumbnail', ''))
                              })
                          else:
                              m_s = re.search(r'app/(\d+)', link)
                              aid = m_s.group(1) if m_s else link
                              if aid.isdigit():
                                  FORCED_ADD[aid] = {
                                      "type": item.get('type', 'to_paid'), "end_date": str(raw_date), "name": name,
                                      "_custom_desc": str(item.get('desc', '')), "_custom_thumb": str(item.get('thumbnail', ''))
                                  }
              except Exception as e: print(f"⚠️ manager.yml 解析失败: {e}")

          def post_update(filename, data):
              headers = {**HEADERS, 'filename': filename, 'Content-Type': 'application/json'}
              try:
                  res = requests.post(f"https://{API_BASE}/v1/update/steam-daily-free", headers=headers, json=data, timeout=20)
                  if res.status_code == 200: print(f"✅ 上传 {filename} 成功!")
              except: pass

          def verify_steam_app(app_id):
              if str(app_id) in BLACKLIST: return {"status": "invalid"}
              forced = FORCED_ADD.get(str(app_id))
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res_raw = requests.get(url, headers=HEADERS, timeout=10)
                  d = {}
                  if res_raw.status_code == 200:
                      rj = res_raw.json()
                      if str(app_id) in rj and rj[str(app_id)]['success']: d = rj[str(app_id)]['data']
                  
                  if not d and not forced: return {"status": "invalid"}
                  
                  price = d.get('price_overview', {})
                  is_100 = price.get('discount_percent') == 100
                  
                  g_type = "100_off"
                  if forced and forced.get('type'): g_type = forced['type']
                  elif is_100: g_type = "100_off"
                  elif d.get('is_free'): g_type = "to_paid"
                  
                  z_title = (forced.get('name') if forced else None) or d.get('name') or f"App {app_id}"
                  thumb = (forced.get('_custom_thumb') if forced else None) or d.get('header_image')
                  desc = (forced.get('_custom_desc') if forced else None) or d.get('short_description', 'Steam 福利放送')
                  e_date = (forced.get('end_date') if forced and forced.get('end_date') else "限免进行中")

                  return {
                      "status": "valid", "type": g_type,
                      "details": {
                          "steam_id": str(app_id), "zh_title": z_title, "thumbnail": thumb,
                          "short_description": desc, "end_date": e_date, "platform": "Steam", "type": g_type
                      }
                  }
              except: return {"status": "invalid"}

          def main():
              db = {}
              if os.path.exists(DB_FILE):
                  with open(DB_FILE, 'r') as f: db = json.load(f)

              active_games = []
              
              # --- 处理 Epic ---
              print("🕵️ 正在同步 Epic 数据...")
              epic_api = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN"
              try:
                  res = requests.get(epic_api, timeout=10).json()
                  for item in res['data']['Catalog']['searchStore']['elements']:
                      slug = (item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug') or "").lower()
                      if not slug or slug in BLACKLIST: continue
                      
                      # 基础属性提取
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      desc = str(item.get('description') or item.get('shortDescription') or '').strip()
                      title = item['title']
                      
                      # ✨ 核心修复：检查是否有手动覆盖规则 (强制替换逻辑)
                      manual = next((f for f in FORCED_EPIC if f['epic_slug'] == slug), None)
                      if manual:
                          if manual.get('zh_title'): title = manual['zh_title']
                          if manual.get('_custom_desc'): desc = manual['_custom_desc']
                          if manual.get('_custom_thumb'): img = manual['_custom_thumb']
                          manual['_processed'] = True # 标记已处理，防止后面重复添加

                      promos = item.get('promotions', {})
                      is_upcoming = False
                      e_date = "N/A"
                      
                      if promos and promos.get('promotionalOffers'):
                          try:
                              off = promos['promotionalOffers'][0]['promotionalOffers'][0]
                              if off.get('discountSetting', {}).get('discountPercentage') == 0: e_date = off['endDate']
                          except: pass
                      elif promos and promos.get('upcomingPromotionalOffers'):
                          try:
                              off = promos['upcomingPromotionalOffers'][0]['promotionalOffers'][0]
                              if off.get('discountSetting', {}).get('discountPercentage') == 0:
                                  e_date = off['endDate']
                                  is_upcoming = True
                          except: pass

                      if e_date != "N/A" and slug not in PROCESSED_EPIC_SLUGS:
                          active_games.append({
                              "zh_title": title, "thumbnail": img, "short_description": desc,
                              "end_date": e_date, "platform": "Epic Games", "epic_slug": slug,
                              "type": "100_off", "is_upcoming": is_upcoming
                          })
                          PROCESSED_EPIC_SLUGS.add(slug)
              except: pass

              # 处理 Epic “上帝模式”中 API 没抓到的遗漏游戏
              for fe in FORCED_EPIC:
                  if not fe.get('_processed') and fe['epic_slug'] not in PROCESSED_EPIC_SLUGS:
                      active_games.append({
                          "zh_title": fe['zh_title'], "thumbnail": fe['_custom_thumb'], 
                          "short_description": fe['_custom_desc'], "end_date": fe['end_date'] or "限免进行中",
                          "platform": "Epic Games", "epic_slug": fe['epic_slug'], "type": fe.get('type', '100_off')
                      })
                      PROCESSED_EPIC_SLUGS.add(fe['epic_slug'])

              # --- 处理 Steam ---
              print("🕵️ 正在同步 Steam 数据...")
              scraped_ids = set(FORCED_ADD.keys())
              # 这里可以加入全网爬虫搜刮逻辑...
              
              for aid in scraped_ids:
                  res = verify_steam_app(aid)
                  if res['status'] == 'valid':
                      active_games.append(res['details'])
                      db[aid] = res

              # --- 推送与保存 ---
              post_update("games.json", active_games)
              with open(DB_FILE, 'w', encoding='utf-8') as f:
                  json.dump(db, f, ensure_ascii=False, indent=2)
              print("✅ ETL 流程完成！")

          if __name__ == "__main__": main()
          EOF
          python processor.py

      - name: Commit and Push DB
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add steam_db.json games.json || true
          git commit -m "Auto Update ETL Database [skip ci]" || true
          git pull --rebase origin main || true
          git push
