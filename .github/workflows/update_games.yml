name: Update Games (Final Pipeline)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests

      - name: Run Smart Processor
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import hashlib
          import time
          import random
          import string
          from datetime import datetime, timedelta

          HOST = 'system.et-api.com'
          # ⚡ 核心：签名生成函数
          def get_signed_headers(method, path):
              ver = "1773281024"
              nonce = ''.join(random.choices(string.ascii_letters + string.digits, k=32))
              ts = str(int(time.time()))
              ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
              sign_string = f"{method}{HOST}{path}?ver={ver}&nonce={nonce}&ts={ts}&ua={ua}"
              sig = hashlib.sha256(sign_string.encode('utf-8')).hexdigest()
              return {'User-Agent': ua, 'sig': sig, 'ts': ts, 'nonce': nonce, 'ver': ver}

          def main():
              active_games, upcoming_list = [], []
              
              # 1. 抓取 Epic 官方限免
              epic_api = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN"
              try:
                  res = requests.get(epic_api, timeout=10).json()
                  elements = res['data']['Catalog']['searchStore']['elements']
                  for item in elements:
                      promos = item.get('promotions')
                      if not promos: continue
                      slug = (item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or 
                              item.get('productSlug') or item.get('urlSlug') or "free-games")
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      
                      for active_nodes in promos.get('promotionalOffers', []):
                          for offer in active_nodes.get('promotionalOffers', []):
                              if offer.get('discountSetting', {}).get('discountPercentage') == 0:
                                  active_games.append({"zh_title": item['title'], "thumbnail": img, "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug})
                      
                      for upcoming_nodes in promos.get('upcomingPromotionalOffers', []):
                          for offer in upcoming_nodes.get('promotionalOffers', []):
                              upcoming_list.append({"zh_title": item['title'], "image": img, "start_date": offer['startDate'], "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug})
              except: pass

              # 2. 抓取隐藏雷达 (GamerPower)
              try:
                  gp_url = "https://www.gamerpower.com/api/giveaways?platform=epic-games-store"
                  gp_data = requests.get(gp_url, timeout=15).json()
                  official_slugs = {g.get('epic_slug') for g in active_games + upcoming_list}
                  
                  for g in gp_data:
                      title = g.get('title', '')
                      worth = g.get('worth', 'Free')
                      status = g.get('status', '')
                      g_type = g.get('type', '')
                      
                      # ⚡ 零硬编码识别逻辑：只要是 Active 的付费游戏本体就放行
                      is_paid = worth not in ["Free", "N/A", "$0.00", "0.00", 0]
                      if status == 'Active' and g_type == 'Game' and is_paid:
                          # 提取 Slug
                          link = g.get('open_giveaway_url', '')
                          actual_url = requests.get(link, timeout=10).url
                          m = re.search(r'store\.epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?(?:p|bundles)/([^/?#]+)', actual_url)
                          if m:
                              slug = m.group(1)
                              if slug not in official_slugs:
                                  end_date = (datetime.utcnow() + timedelta(days=7)).strftime('%Y-%m-%dT23:59:59Z')
                                  active_games.append({"zh_title": title, "thumbnail": g.get('thumbnail'), "end_date": end_date, "platform": "Epic Games", "epic_slug": slug, "short_description": "Epic 官方活动赠送"})
                                  print(f"✅ Captured: {title}")
              except: pass

              # 3. 带着签名更新服务器
              for fn, data in [("games.json", active_games), ("upcoming.json", upcoming_list)]:
                  headers = get_signed_headers('POST', '/v1/update/steam-daily-free')
                  headers.update({"filename": fn, "Content-Type": "application/json"})
                  res = requests.post(f"https://{HOST}/v1/update/steam-daily-free", headers=headers, json=data)
                  print(f"🚀 Update {fn} Status: {res.status_code}")

          if __name__ == "__main__": main()
          EOF
          python processor.py
