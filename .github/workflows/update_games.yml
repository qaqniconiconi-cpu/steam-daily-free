name: Update Games (ETL Smart Engine)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run ETL Processor
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import time
          import hashlib
          import random
          import string
          import os
          import yaml
          import urllib.parse
          from datetime import datetime, timedelta

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          
          API_BASE = os.environ.get('API_BASE', '') 
          if not API_BASE:
              print("⚠️ 未检测到 API_BASE 环境变量，请在 GitHub Secrets 中配置！")
              API_BASE = 'localhost'
              
          DB_FILE = 'steam_db.json'

          BLACKLIST = set()
          FORCED_ADD = {}
          FORCED_EPIC = []
          SCRAPED_EPIC_SLUGS = set()

          # ==========================================
          # 1. 加载手动管理菜单 (manager.yml)
          # ==========================================
          if os.path.exists('manager.yml'):
              print("🎛️ 加载手动管理规则...")
              try:
                  with open('manager.yml', 'r', encoding='utf-8') as f:
                      mgr = yaml.safe_load(f) or {}
                      
                      # 黑名单处理
                      dis = mgr.get('disable') or mgr.get('DISABLE') or []
                      if not isinstance(dis, list): dis = [dis]
                      for item in dis:
                          it = str(item).strip()
                          m_s = re.search(r'app/(\d+)', it)
                          m_e = re.search(r'p/([^/?#]+)', it)
                          if m_s: BLACKLIST.add(m_s.group(1))
                          elif m_e: BLACKLIST.add(m_e.group(1))
                          else: BLACKLIST.add(it)
                          
                      # 添加/修改规则处理
                      adds = mgr.get('add') or mgr.get('ADD') or []
                      if not isinstance(adds, list): adds = [adds]
                      for item in adds:
                          if isinstance(item, dict):
                              link = str(item.get('link', '')).strip()
                              name = str(item.get('name', '')).strip()
                              c_thumb = str(item.get('thumbnail', '')).strip()
                              c_desc = str(item.get('desc', item.get('description', ''))).strip()
                              
                              raw_date = item.get('end_date') or item.get('endTime') or ""
                              if isinstance(raw_date, datetime): 
                                  raw_date_str = raw_date.strftime('%Y-%m-%dT%H:%M:%SZ')
                              else: 
                                  raw_date_str = str(raw_date).strip() if raw_date else ""
                              
                              is_epic = 'epicgames.com' in link.lower() or str(item.get('platform', '')).lower() == 'epic'
                              if is_epic:
                                  m_e = re.search(r'p/([^/?#]+)', link)
                                  slug = m_e.group(1) if m_e else link.split('/')[-1]
                                  FORCED_EPIC.append({
                                      "epic_slug": slug, "zh_title": name, "end_date": raw_date_str,
                                      "platform": "Epic Games", "type": item.get('type', '100_off'),
                                      "_custom_desc": c_desc, "_custom_thumb": c_thumb
                                  })
                              else:
                                  m_s = re.search(r'app/(\d+)', link)
                                  aid = m_s.group(1) if m_s else link
                                  if aid.isdigit():
                                      FORCED_ADD[aid] = {
                                          "type": item.get('type', '100_off'), "end_date": raw_date_str, "name": name,
                                          "_custom_desc": c_desc, "_custom_thumb": c_thumb
                                      }
              except Exception as e: print(f"⚠️ manager.yml 解析失败: {e}")

          def post_update(filename, data):
              headers = {**HEADERS, 'filename': filename, 'Content-Type': 'application/json'}
              try:
                  res = requests.post(f"https://{API_BASE}/v1/update/steam-daily-free", headers=headers, json=data, timeout=20)
                  if res.status_code == 200: print(f"✅ 上传 {filename} 成功!")
              except: pass

          def parse_date_smart(text):
              text = text.lower()
              now = datetime.utcnow()
              best_dt = None
              cn_dates = re.findall(r'(?:(\d{4})年)?(\d{1,2})月(\d{1,2})[日号]?', text)
              for y_str, m_str, d_str in cn_dates:
                  y = int(y_str) if y_str else now.year
                  m, d = int(m_str), int(d_str)
                  if m < now.month - 2 and not y_str: y += 1
                  try: 
                      dt = datetime(y, m, d, 17, 0, 0)
                      if not best_dt or dt > best_dt: best_dt = dt
                  except: pass
              if best_dt: return best_dt.strftime('%Y-%m-%dT%H:%M:%SZ')
              return "N/A"

          # ==========================================
          # 2. Steam 验证引擎
          # ==========================================
          def verify_steam_app(app_id):
              if str(app_id) in BLACKLIST: return {"status": "invalid"}
              forced = FORCED_ADD.get(str(app_id))
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res_raw = requests.get(url, headers=HEADERS, timeout=10)
                  d = {}
                  if res_raw.status_code == 200:
                      rj = res_raw.json()
                      if str(app_id) in rj and rj[str(app_id)]['success']: d = rj[str(app_id)]['data']
                  
                  if not d and not forced: return {"status": "invalid"}
                  
                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free_license = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))
                  if not is_100_off and has_free_license and price.get('final', 0) == 0 and not is_free: is_100_off = True

                  end_date = "N/A"
                  if price.get('discount_expiration'): end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  
                  if end_date == "N/A":
                      try:
                          h = requests.get(f"https://store.steampowered.com/app/{app_id}?l=english", headers=HEADERS, cookies=COOKIES, timeout=5).text
                          if "Free to keep" in h: is_100_off = True
                      except: pass

                  # 类型判定：优先手动
                  g_type = "100_off"
                  if forced and forced.get('type'): g_type = forced['type']
                  elif is_100_off: g_type = "100_off"
                  elif (has_free_license or (not is_free and price.get('final', 0) == 0)): g_type = "weekend"
                  elif is_free: g_type = "to_paid"
                  else: return {"status": "invalid"} # 如果只是普通打折，不进喜加一列表

                  z_title = (forced.get('name') if forced else None) or d.get('name') or f"App {app_id}"
                  thumb = (forced.get('_custom_thumb') if forced else None) or d.get('header_image')
                  desc = (forced.get('_custom_desc') if forced else None) or d.get('short_description', 'Steam 福利放送')
                  e_date = (forced.get('end_date') if forced and forced.get('end_date') else end_date)
                  if e_date == "N/A": e_date = "限免进行中"

                  return {
                      "status": "valid", "type": g_type,
                      "details": {
                          "steam_id": str(app_id), "zh_title": z_title, "thumbnail": thumb,
                          "short_description": desc, "end_date": e_date, "platform": "Steam", "type": g_type
                      }
                  }
              except: return {"status": "invalid"}

          # ==========================================
          # 3. Steam 特惠引擎 (Deals)
          # ==========================================
          def fetch_steam_deals():
              print("🔥 抓取 Steam 特惠排行榜...")
              deals = []
              try:
                  url = "https://store.steampowered.com/search/results/?query&start=0&count=50&specials=1&cc=cn&l=schinese&filter=globaltopsellers"
                  res = requests.get(url, headers=HEADERS, timeout=10).json()
                  blocks = res.get('results_html', '').split('data-ds-appid="')[1:]
                  for b in blocks[:50]:
                      try:
                          aid = b.split('"')[0].split(',')[0]
                          title = re.search(r'<span class="title">([^<]+)</span>', b).group(1)
                          img = f"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/{aid}/header.jpg"
                          m_pct = re.search(r'-(\d+)%', b)
                          m_final = re.search(r'discount_final_price">[^0-9]*([\d\.,]+)', b)
                          if m_pct and m_final:
                              deals.append({
                                  "id": aid, "name": title, "img": img, 
                                  "discount": int(m_pct.group(1)), "finalPrice": m_final.group(1)
                              })
                      except: pass
              except: pass
              return deals

          # ==========================================
          # 4. 主流程
          # ==========================================
          def main():
              db = {}
              if os.path.exists(DB_FILE):
                  with open(DB_FILE, 'r') as f: db = json.load(f)

              # 分离列表
              list_games = []  # 100% Off
              list_intel = {"to_paid": [], "free_weekend": []}
              
              scraped_steam_ids = set(FORCED_ADD.keys())

              # A. 搜刮 Steam 福利
              print("🕵️ 搜刮全网 Steam 福利情报...")
              try:
                  r = requests.get("https://www.gamerpower.com/api/giveaways?platform=steam", timeout=10)
                  scraped_steam_ids.update(re.findall(r'app/(\d+)', r.text))
              except: pass
              
              for aid in scraped_steam_ids:
                  res = verify_steam_app(aid)
                  if res['status'] == 'valid':
                      item, g_type = res['details'], res['type']
                      if g_type == "100_off": list_games.append(item)
                      elif g_type == "weekend": list_intel["free_weekend"].append(item)
                      else: list_intel["to_paid"].append(item)
                      db[aid] = res

              # B. 处理 Epic 官方 API
              print("🕵️ 同步 Epic 数据并应用拦截器...")
              epic_api = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN"
              try:
                  res = requests.get(epic_api, timeout=10).json()
                  for item in res['data']['Catalog']['searchStore']['elements']:
                      slug = item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug')
                      if not slug or slug in BLACKLIST: continue
                      
                      # 默认提取
                      title, desc = item['title'], item.get('description', '')
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      
                      # ✨ 核心拦截：应用 manager.yml 的手动修改
                      forced = next((f for f in FORCED_EPIC if f['epic_slug'] == slug), None)
                      g_type = "100_off"
                      if forced:
                          if forced.get('zh_title'): title = forced['zh_title']
                          if forced.get('_custom_desc'): desc = forced['_custom_desc']
                          if forced.get('_custom_thumb'): img = forced['_custom_thumb']
                          g_type = forced.get('type', '100_off')

                      promos = item.get('promotions', {})
                      e_date = "N/A"
                      is_up = False
                      if promos.get('promotionalOffers'):
                          off = promos['promotionalOffers'][0]['promotionalOffers'][0]
                          if off.get('discountSetting', {}).get('discountPercentage') == 0: e_date = off['endDate']
                      elif promos.get('upcomingPromotionalOffers'):
                          off = promos['upcomingPromotionalOffers'][0]['promotionalOffers'][0]
                          if off.get('discountSetting', {}).get('discountPercentage') == 0: 
                              e_date = off['endDate']
                              is_up = True

                      if e_date != "N/A":
                          game_obj = {
                              "zh_title": title, "thumbnail": img, "short_description": desc,
                              "end_date": (forced.get('end_date') if forced and forced.get('end_date') else e_date),
                              "platform": "Epic Games", "epic_slug": slug, "type": g_type, "is_upcoming": is_up
                          }
                          if g_type == "100_off": list_games.append(game_obj)
                          elif g_type == "weekend": list_intel["free_weekend"].append(game_obj)
                          else: list_intel["to_paid"].append(game_obj)
              except: pass

              # C. 处理 Epic 上帝模式独立添加
              current_epic_slugs = {g.get('epic_slug') for g in list_games if g.get('epic_slug')}
              for fe in FORCED_EPIC:
                  if fe['epic_slug'] not in current_epic_slugs and fe['epic_slug'] not in BLACKLIST:
                      clean_fe = {k: v for k, v in fe.items() if not k.startswith('_')}
                      g_type = fe.get('type', '100_off')
                      if g_type == "100_off": list_games.append(clean_fe)
                      elif g_type == "weekend": list_intel["free_weekend"].append(clean_fe)
                      else: list_intel["to_paid"].append(clean_fe)

              # D. 数据推送
              print(f"🚀 推送喜加一: {len(list_games)} 款")
              post_update("games.json", list_games)
              
              print(f"🚀 推送福利情报 (Intel)")
              post_update("intel.json", list_intel)
              
              deals = fetch_steam_deals()
              post_update("deals.json", deals)

              with open(DB_FILE, 'w', encoding='utf-8') as f:
                  json.dump(db, f, ensure_ascii=False, indent=2)
              print("✅ ETL 业务更新完成！")

          if __name__ == "__main__": main()
          EOF
          python processor.py

      - name: Commit and Push DB
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add steam_db.json games.json intel.json deals.json || true
          git commit -m "Auto Update ETL Database [skip ci]" || true
          git pull --rebase origin main || true
          git push
