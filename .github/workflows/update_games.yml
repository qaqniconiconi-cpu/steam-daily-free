          def normalize_api_payload(payload):
              if isinstance(payload, dict) and 'data' in payload:
                  return payload.get('data') or []
              return payload or []

          def parse_iso_dt(value):
              if not value or value in ("N/A", "限免进行中", "近期即将转付费"):
                  return None
              if isinstance(value, datetime):
                  return value
              s = str(value).strip().replace('.000Z', 'Z')
              s = s.replace('Z', '')
              for fmt in ('%Y-%m-%dT%H:%M:%S', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d'):
                  try:
                      return datetime.strptime(s, fmt)
                  except Exception:
                      pass
              return None

          def item_is_expired(item):
              dt = parse_iso_dt(item.get('end_date') or item.get('endDate'))
              return bool(dt and dt < datetime.utcnow())

          def item_is_blacklisted(item):
              if not isinstance(item, dict) or not BLACKLIST:
                  return False

              candidates = set()
              for k in (
                  'steam_id', 'app_id', 'appid', 'id',
                  'epic_slug', 'slug',
                  'custom_url', 'url', 'link', 'title_url', 'button_url',
                  'zh_title', 'name', 'title'
              ):
                  v = item.get(k)
                  if not v:
                      continue
                  s = str(v).strip().lower()
                  if not s:
                      continue
                  candidates.add(s)
                  for app_id in re.findall(r'(?:store\.steampowered\.com/)?app/(\d+)', s, re.I):
                      candidates.add(app_id)
                  for slug in re.findall(r'epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?p/([^/?#]+)', s, re.I):
                      candidates.add(slug.lower())

              for blocked in BLACKLIST:
                  b = str(blocked).strip().lower()
                  if not b:
                      continue
                  if b in candidates:
                      return True
                  if not b.isdigit() and any(b in c for c in candidates):
                      return True
              return False

          def item_identity(item):
              for k in ('steam_id', 'epic_slug', 'custom_url', 'url', 'link', 'id', 'zh_title', 'name', 'title'):
                  v = item.get(k) if isinstance(item, dict) else None
                  if v:
                      return f"{k}:{str(v).strip().lower()}"
              return ''

          def append_unique(target, item, seen):
              if item_is_blacklisted(item) or item_is_expired(item):
                  return False
              key = item_identity(item)
              if key and key not in seen:
                  target.append(item)
                  seen.add(key)
                  return True
              return False

          def route_game_item(obj, g_type, final_games, final_intel, seen_games, seen_intel):
              if not obj:
                  return
              is_up = obj.get('is_upcoming') or g_type == 'upcoming'
              if is_up:
                  obj['is_upcoming'] = True
                  obj['type'] = 'upcoming'
                  append_unique(final_games, obj, seen_games)
              elif g_type == '100_off':
                  append_unique(final_games, obj, seen_games)
              elif g_type == 'to_paid':
                  append_unique(final_intel['to_paid'], obj, seen_intel)
              elif g_type == 'freeplay':
                  append_unique(final_intel['freeplay'], obj, seen_intel)

          def extract_steam_appids(text):
              if not text:
                  return set()
              text = html.unescape(str(text))
              ids = set(re.findall(r'store\.steampowered\.com/app/(\d+)', text, re.I))
              ids.update(re.findall(r'data-ds-appid=[\'"](\d+)[\'"]', text, re.I))
              ids.update(re.findall(r'/app/(\d+)', text, re.I))
              return {x for x in ids if x.isdigit()}

          def steam_search_ids(url, source_name, only_free_hint=False):
              ids = set()
              try:
                  res = requests.get(url, headers=HEADERS, timeout=15)
                  if res.status_code != 200:
                      print(f"⚠️ {source_name} HTTP {res.status_code}")
                      return ids

                  raw = res.text
                  try:
                      js = res.json()
                      raw_html = js.get('results_html', '') if isinstance(js, dict) else ''
                  except Exception:
                      raw_html = raw

                  raw_html = html.unescape(raw_html or raw)
                  if only_free_hint:
                      blocks = re.findall(r'<a[^>]*?search_result_row.*?</a>', raw_html, re.DOTALL | re.I)
                      for b in blocks:
                          if re.search(r'(-100%|>免费<|>Free<|Free To Keep|free to keep|100%\s*off)', b, re.I):
                              ids.update(extract_steam_appids(b))
                  else:
                      ids.update(extract_steam_appids(raw_html))

                  print(f"🔎 {source_name}: 候选 {len(ids)} 个")
              except Exception as e:
                  print(f"⚠️ {source_name} 抓取异常：{repr(e)}")
              return ids

          def fetch_steam_candidates():
              scraped_ids = set()
              source_stats = {}

              def add_ids(source, ids):
                  before = len(scraped_ids)
                  scraped_ids.update({str(i) for i in ids if str(i).isdigit()})
                  source_stats[source] = len(scraped_ids) - before
                  print(f"🧩 {source}: 新增 {source_stats[source]} 个，累计 {len(scraped_ids)} 个")

              # A. GamerPower：字段经常变化，直接扫描整条 JSON 字符串里的 Steam app 链接
              try:
                  res_gp = requests.get("https://www.gamerpower.com/api/giveaways?platform=steam", headers=HEADERS, timeout=15)
                  if res_gp.status_code == 200:
                      add_ids("GamerPower", extract_steam_appids(json.dumps(res_gp.json(), ensure_ascii=False)))
                  else:
                      print(f"⚠️ GamerPower HTTP {res_gp.status_code}")
              except Exception as e:
                  print(f"⚠️ GamerPower 抓取异常：{repr(e)}")

              # B. 社区源：原逻辑失败时不会再静默吞掉
              reddit_headers = {**HEADERS, 'User-Agent': 'free-game-etl/1.1 by github-actions'}
              community_sources = [
                  ("Keylol RSS", "https://keylol.com/forum.php?mod=rss&fid=319", HEADERS),
                  ("Reddit FreeGameFindings", "https://www.reddit.com/r/FreeGameFindings/new.json?limit=100", reddit_headers),
                  ("Reddit FreeGamesOnSteam", "https://www.reddit.com/r/FreeGamesOnSteam/new.json?limit=100", reddit_headers),
              ]
              for name, url, headers in community_sources:
                  try:
                      res = requests.get(url, headers=headers, timeout=15)
                      if res.status_code == 200:
                          add_ids(name, extract_steam_appids(res.text))
                      else:
                          print(f"⚠️ {name} HTTP {res.status_code}")
                  except Exception as e:
                      print(f"⚠️ {name} 抓取异常：{repr(e)}")

              # C. Steam 官方搜索页：多条件、多区域扫候选，再交给 verify_steam_app 二次验证
              for cc in ("CN", "US"):
                  for page in range(0, 4):
                      start = page * 50
                      urls = [
                          (
                              f"Steam {cc} 100%off page{page+1}",
                              f"https://store.steampowered.com/search/results/?query&start={start}&count=50&dynamic_data=&sort_by=_ASC&snr=1_7_7_7000_7&specials=1&infinite=1&cc={cc}&l=schinese",
                              True
                          ),
                          (
                              f"Steam {cc} free+special page{page+1}",
                              f"https://store.steampowered.com/search/results/?query&start={start}&count=50&dynamic_data=&force_infinite=1&category1=998&specials=1&maxprice=free&infinite=1&cc={cc}&l=schinese",
                              False
                          ),
                      ]
                      for source_name, url, only_hint in urls:
                          add_ids(source_name, steam_search_ids(url, source_name, only_free_hint=only_hint))
                          time.sleep(0.3)

              print("📊 Steam 候选源统计：" + json.dumps(source_stats, ensure_ascii=False))
              return scraped_ids

          # ==========================================
          # 5. 主程序：分发数据流
          # ==========================================
          def main():
              db = {}
              if os.path.exists(DB_FILE):
                  try:
                      with open(DB_FILE, 'r', encoding='utf-8') as f:
                          db = json.load(f)
                  except Exception as e:
                      print(f"⚠️ 读取 {DB_FILE} 失败：{repr(e)}")

              # 如果手动项被删除，旧的强制 Steam 项需要重新进入普通验证/过期流程
              for app_id, data in list(db.items()):
                  if data.get('status') == 'valid' and data.get('details', {}).get('_is_forced'):
                      if str(app_id) not in FORCED_ADD:
                          db[app_id] = {"status": "pending"}

              scraped_ids = fetch_steam_candidates()
              for app_id in scraped_ids:
                  current_status = db.get(app_id, {}).get('status')
                  if app_id not in db or current_status in ('invalid', 'expired'):
                      db[app_id] = {"status": "pending"}

              for f_id in FORCED_ADD:
                  db[f_id] = {"status": "pending"}

              pending_ids = [app_id for app_id, data in db.items() if data.get('status') == 'pending']
              pending_ids.sort(key=lambda x: 0 if x in FORCED_ADD else 1)
              verify_limit = int(os.environ.get('VERIFY_LIMIT', '150'))
              print(f"🧪 待验证 Steam App：{len(pending_ids)} 个，本轮最多验证 {verify_limit} 个")

              verify_stats = {"valid": 0, "invalid": 0, "rate_limit": 0}
              for app_id in pending_ids[:verify_limit]:
                  res = verify_steam_app(app_id)
                  status = res.get("status", "invalid")
                  verify_stats[status] = verify_stats.get(status, 0) + 1
                  if status == "rate_limit":
                      print("⛔ Steam API 触发 429，本轮停止验证，保留未验证项到下次运行")
                      break
                  db[app_id] = res
                  time.sleep(1.2)
              print("📊 Steam 验证统计：" + json.dumps(verify_stats, ensure_ascii=False))

              final_games = []
              final_intel = {"to_paid": [], "freeplay": []}
              seen_games = set()
              seen_intel = set()
              processed_slugs = set()

              # A. Steam 已验证数据
              steam_added = 0
              for app_id, data in list(db.items()):
                  if data.get('status') != 'valid':
                      continue
                  if str(app_id) in BLACKLIST or "epicgames.com" in str(app_id).lower():
                      db[app_id]['status'] = 'invalid'
                      continue

                  details = data.get('details', {})
                  if details.get('platform') == 'Epic Games':
                      continue

                  if item_is_expired(details):
                      print(f"⏰ Steam 项已过期跳过：app/{app_id} end={details.get('end_date') or details.get('endDate')} forced={details.get('_is_forced')}")
                      db[app_id]['status'] = 'expired'
                      continue

                  clean_details = {k: v for k, v in details.items() if not k.startswith('_')}
                  before = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  route_game_item(clean_details, data.get('type', clean_details.get('type', '100_off')), final_games, final_intel, seen_games, seen_intel)
                  after = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  if after > before:
                      steam_added += 1
              print(f"✅ Steam 有效入库：{steam_added} 款")

              # B. Epic 官方接口
              epic_urls = [
                 "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN",
                 "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en-US&country=US&allowCountries=US"
              ]

              epic_added = 0
              for e_url in epic_urls:
                  try:
                      e_res = requests.get(e_url, headers=HEADERS, timeout=15)
                      if e_res.status_code != 200:
                          print(f"⚠️ Epic 官方接口 HTTP {e_res.status_code}: {e_url}")
                          continue
                      res = e_res.json()
                      elements = res.get('data', {}).get('Catalog', {}).get('searchStore', {}).get('elements', [])
                      print(f"🔎 Epic 官方接口返回 {len(elements)} 条：{e_url}")
                      for item in elements:
                          promos = item.get('promotions')
                          if not promos:
                              continue
                          slug = (item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug') or "free").lower()
                          if slug in BLACKLIST or slug in processed_slugs:
                              continue

                          img = next((i.get('url') for i in item.get('keyImages', []) if i.get('type') in ['OfferImageWide', 'Thumbnail']), "")
                          desc = str(item.get('description') or item.get('shortDescription') or '').strip()
                          title = item.get('title', slug)
                          price_obj = item.get('price', {}).get('totalPrice', {}).get('fmtPrice', {})
                          orig_price = price_obj.get('originalPrice', '')

                          forced_info = next((f for f in FORCED_EPIC if f.get('epic_slug') == slug), None)
                          g_type = "100_off"
                          if forced_info:
                              if forced_info.get('zh_title'): title = forced_info['zh_title']
                              if forced_info.get('_custom_desc'): desc = forced_info['_custom_desc']
                              if forced_info.get('_custom_thumb'): img = forced_info['_custom_thumb']
                              g_type = forced_info.get('type', '100_off')

                          is_up = False
                          e_date = "N/A"

                          if promos.get('promotionalOffers'):
                              try:
                                  offs = promos['promotionalOffers'][0]['promotionalOffers']
                                  if offs and offs[0].get('discountSetting', {}).get('discountPercentage') == 0:
                                      e_date = offs[0]['endDate']
                              except Exception as e:
                                  print(f"⚠️ Epic 当前优惠解析失败 {slug}: {repr(e)}")
                          elif promos.get('upcomingPromotionalOffers'):
                              try:
                                  offs = promos['upcomingPromotionalOffers'][0]['promotionalOffers']
                                  if offs and offs[0].get('discountSetting', {}).get('discountPercentage') == 0:
                                      e_date = offs[0]['endDate']
                                      is_up = True
                              except Exception as e:
                                  print(f"⚠️ Epic 预告优惠解析失败 {slug}: {repr(e)}")

                          if e_date != "N/A":
                              game_obj = {
                                  "zh_title": title, "thumbnail": img, "short_description": desc,
                                  "original_price": orig_price,
                                  "end_date": (forced_info.get('end_date') if forced_info and forced_info.get('end_date') else e_date),
                                  "platform": "Epic Games", "epic_slug": slug, "type": g_type, "is_upcoming": is_up,
                                  "title_url": forced_info.get('title_url', '') if forced_info else '',
                                  "button_url": forced_info.get('button_url', '') if forced_info else '',
                                  "sort_order": forced_info.get('sort_order', '') if forced_info else ''
                              }
                              before = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                              route_game_item(game_obj, 'upcoming' if is_up else g_type, final_games, final_intel, seen_games, seen_intel)
                              after = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                              if after > before:
                                  epic_added += 1
                              processed_slugs.add(slug)
                  except Exception as e:
                      print(f"⚠️ Epic 官方接口抓取异常：{repr(e)}")
              print(f"✅ Epic 官方入库：{epic_added} 款")

              # C. Epic 手动兜底
              forced_epic_added = 0
              for fe in FORCED_EPIC:
                  if fe.get('epic_slug') in processed_slugs or fe.get('epic_slug') in BLACKLIST:
                      continue
                  if item_is_expired(fe):
                      continue
                  clean_fe = {k: v for k, v in fe.items() if not k.startswith('_')}
                  before = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  route_game_item(clean_fe, fe.get('type', '100_off'), final_games, final_intel, seen_games, seen_intel)
                  after = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  if after > before:
                      forced_epic_added += 1
              print(f"✅ Epic 手动兜底入库：{forced_epic_added} 款")

              # D. Steam/Epic 平台页面兜底链接
              forced_platform_link_added = 0
              for fc in FORCED_CUSTOM:
                  fc_url = str(fc.get('custom_url') or fc.get('url') or '').strip()
                  if not fc_url or fc_url.lower() in BLACKLIST or str(fc.get('zh_title', '')).lower() in BLACKLIST:
                      continue
                  if item_is_expired(fc):
                      continue
                  clean_fc = {k: v for k, v in fc.items() if not k.startswith('_') and v != ''}
                  before = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  route_game_item(clean_fc, fc.get('type', '100_off'), final_games, final_intel, seen_games, seen_intel)
                  after = len(final_games) + len(final_intel['to_paid']) + len(final_intel['freeplay'])
                  if after > before:
                      forced_platform_link_added += 1
              print(f"✅ 平台页面兜底入库：{forced_platform_link_added} 款")

              # E. 如果自动源临时失败，合并后端旧的未过期项，避免一次空抓取覆盖前端
              try:
                  old_games = normalize_api_payload(fetch_old_data("games.json"))
                  if isinstance(old_games, list):
                      restored = 0
                      for old in old_games:
                          if isinstance(old, dict) and not item_is_expired(old) and not item_is_blacklisted(old):
                              if append_unique(final_games, old, seen_games):
                                  restored += 1
                      if restored:
                          print(f"🧯 已从旧 games.json 保留未过期项：{restored} 款")
              except Exception as e:
                  print(f"⚠️ 读取旧 games.json 兜底失败：{repr(e)}")

              try:
                  old_intel = normalize_api_payload(fetch_old_data("intel.json"))
                  if isinstance(old_intel, dict):
                      for bucket in ('to_paid', 'freeplay'):
                          restored = 0
                          for old in old_intel.get(bucket, []) or []:
                              if isinstance(old, dict) and not item_is_expired(old) and not item_is_blacklisted(old):
                                  if append_unique(final_intel[bucket], old, seen_intel):
                                      restored += 1
                          if restored:
                              print(f"🧯 已从旧 intel.json/{bucket} 保留未过期项：{restored} 款")
              except Exception as e:
                  print(f"⚠️ 读取旧 intel.json 兜底失败：{repr(e)}")


              def sort_output_items(items):
                  def key(item):
                      try:
                          order = float(item.get('sort_order', item.get('order', item.get('rank', 999999)))) or 999999
                      except Exception:
                          order = 999999
                      upcoming = 1 if item.get('is_upcoming') or item.get('type') == 'upcoming' else 0
                      return (order, upcoming, str(item.get('zh_title') or item.get('name') or ''))
                  return sorted(items, key=key)

              final_games = sort_output_items(final_games)
              final_intel['to_paid'] = sort_output_items(final_intel.get('to_paid', []))
              final_intel['freeplay'] = sort_output_items(final_intel.get('freeplay', []))

              # F. 获取史低特惠数据
              steam_deals = fetch_steam_deals()

              try:
                  seo_old_games = normalize_api_payload(fetch_old_data("games.json"))
              except Exception as e:
                  print(f"⚠️ SEO hash 读取旧 games.json 失败：{repr(e)}")
                  seo_old_games = []

              try:
                  seo_old_intel = normalize_api_payload(fetch_old_data("intel.json"))
              except Exception as e:
                  print(f"⚠️ SEO hash 读取旧 intel.json 失败：{repr(e)}")
                  seo_old_intel = {}

              try:
                  seo_old_deals = normalize_api_payload(fetch_old_data("deals.json"))
              except Exception as e:
                  print(f"⚠️ SEO hash 读取旧 deals.json 失败：{repr(e)}")
                  seo_old_deals = []

              old_hash = stable_hash({
                  "games": seo_old_games,
                  "intel": seo_old_intel,
                  "deals": seo_old_deals,
              })
              new_hash = stable_hash({
                  "games": final_games,
                  "intel": final_intel,
                  "deals": steam_deals,
              })
              content_changed = old_hash != new_hash
              seo_lastmod = (datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d')
              write_github_output("content_changed", "true" if content_changed else "false")
              write_github_output("lastmod", seo_lastmod)
              print(f"🔎 SEO content_changed={'true' if content_changed else 'false'} lastmod={seo_lastmod}")

              print(f"🚀 正在将喜加一及预告数据推送至后端 API ({len(final_games)} 款)...")
              post_update("games.json", final_games)

              print(f"🚀 正在将情报数据推送至后端 API...")
              post_update("intel.json", final_intel)

              print(f"🚀 正在将特惠折扣数据推送到后端 API ({len(steam_deals)} 款)...")
              post_update("deals.json", steam_deals)

              post_update("upcoming.json", [])

              with open(DB_FILE, 'w', encoding='utf-8') as f:
                  json.dump(db, f, ensure_ascii=False, indent=2)

              print("✅ ETL 全能引擎分流完毕，完美收工！")

          if __name__ == "__main__": main()
          EOF
          python processor.py

      - name: Commit and Push DB
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          rm -f processor.py
          git rm --ignore-unmatch upcoming.json || true
          
          git add -A
          git commit -m "Auto Update Full ETL Database [skip ci]" || true
          git pull --rebase origin main || true
          git push
