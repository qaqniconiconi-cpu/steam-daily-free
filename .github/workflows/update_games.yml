name: Update Games (ETL Smart Engine)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run ETL Processor
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          cat <<'EOF' > processor.py
          import requests
          import json
          import re
          import time
          import hashlib
          import random
          import string
          import os
          import yaml
          import urllib.parse
          from datetime import datetime, timedelta

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          
          API_BASE = os.environ.get('API_BASE', '') 
          if not API_BASE:
              print("⚠️ 未检测到 API_BASE 环境变量，请在 GitHub Secrets 中配置！")
              API_BASE = 'localhost'
              
          DB_FILE = 'steam_db.json'

          BLACKLIST = set()
          FORCED_ADD = {}
          FORCED_EPIC = []
          SCRAPED_EPIC_SLUGS = set()

          # ==========================================
          # 1. 加载手动管理菜单 (manager.yml)
          # ==========================================
          if os.path.exists('manager.yml'):
              print("🎛️ 发现手动管理菜单 manager.yml，正在加载规则...")
              try:
                  with open('manager.yml', 'r', encoding='utf-8') as f:
                      mgr = yaml.safe_load(f) or {}
                      
                      # A. 处理黑名单 (DISABLE)
                      dis = mgr.get('disable') or mgr.get('DISABLE') or []
                      if not isinstance(dis, list): dis = [dis]
                      for item in dis:
                          item_str = str(item).strip()
                          m_s = re.search(r'app/(\d+)', item_str)
                          m_e = re.search(r'epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?p/([^/?#]+)', item_str)
                          if m_s: BLACKLIST.add(m_s.group(1))
                          elif m_e: BLACKLIST.add(m_e.group(1))
                          else: BLACKLIST.add(item_str)
                          
                      # B. 处理添加/修改规则 (ADD)
                      add_list = mgr.get('add') or mgr.get('ADD') or []
                      if not isinstance(add_list, list): add_list = [add_list]
                      for item in add_list:
                          if isinstance(item, dict):
                              link = str(item.get('link', item.get('id', ''))).strip()
                              name = str(item.get('name', '')).strip()
                              custom_thumb = str(item.get('thumbnail', '')).strip()
                              custom_desc = str(item.get('desc', item.get('description', ''))).strip()
                              
                              # 解决日期格式化问题
                              raw_date = item.get('end_date', item.get('endTime', ''))
                              if isinstance(raw_date, datetime): 
                                  raw_date_str = raw_date.strftime('%Y-%m-%dT%H:%M:%SZ')
                              else: 
                                  raw_date_str = str(raw_date).strip() if raw_date else ""
                              
                              is_epic = 'epicgames.com' in link.lower() or str(item.get('platform', '')).lower() == 'epic'
                              if is_epic:
                                  m_e = re.search(r'epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?p/([^/?#]+)', link)
                                  slug = m_e.group(1) if m_e else (link.split('/')[-1] if link else "")
                                  if not slug: continue
                                  
                                  # ✨ 核心修复：找回 Epic 页面爬虫逻辑，确保即使没填图片也能自动抓取
                                  thumb_final, desc_final, name_final = custom_thumb, custom_desc, name
                                  try:
                                      if not thumb_final or not desc_final:
                                          e_url = link if link.startswith('http') else f"https://store.epicgames.com/zh-CN/p/{slug}"
                                          bot_headers = {'User-Agent': 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)', 'Accept-Language': 'zh-CN,zh;q=0.9'}
                                          res_raw = requests.get(e_url, headers=bot_headers, timeout=10)
                                          h = res_raw.text
                                          if not thumb_final:
                                              m_img = re.search(r'property="og:image" content="([^"]+)"', h)
                                              if m_img: thumb_final = m_img.group(1)
                                          if not desc_final:
                                              m_d = re.search(r'property="og:description" content="([^"]+)"', h)
                                              if m_d: desc_final = m_d.group(1).replace('Epic Games Store', '').strip()
                                          if not name_final or name_final == slug:
                                              m_t = re.search(r'<title>([^<]+)</title>', h)
                                              if m_t: name_final = m_t.group(1).split('|')[0].strip()
                                  except: pass

                                  FORCED_EPIC.append({
                                      "epic_slug": slug, "zh_title": name_final or slug, "end_date": raw_date_str or "限免进行中",
                                      "platform": "Epic Games", "type": item.get('type', '100_off'),
                                      "thumbnail": thumb_final or "https://via.placeholder.com/600x300?text=Epic+Games",
                                      "short_description": desc_final or "Epic 隐藏限时免费福利",
                                      "_custom_desc": custom_desc, "_custom_thumb": custom_thumb # 存一份用于后续拦截器对比
                                  })
                                  continue
                              
                              # 处理 Steam 添加规则
                              app_id = ""
                              m_s = re.search(r'app/(\d+)', link)
                              if m_s: app_id = m_s.group(1)
                              elif link.isdigit(): app_id = link
                              if app_id:
                                  FORCED_ADD[app_id] = {
                                      "type": item.get('type', '100_off'), "end_date": raw_date_str, "name": name,
                                      "_custom_desc": custom_desc, "_custom_thumb": custom_thumb
                                  }
              except Exception as e: print(f"⚠️ 解析 manager.yml 失败: {e}")

          def post_update(filename, data):
              headers = {**HEADERS, 'filename': filename, 'Content-Type': 'application/json'}
              for attempt in range(3):
                  try:
                      res = requests.post(f"https://{API_BASE}/v1/update/steam-daily-free", headers=headers, json=data, timeout=20)
                      if res.status_code == 200: 
                          print(f"✅ 上传 {filename} 成功!")
                          return
                  except: time.sleep(3)

          def parse_date_smart(text):
              text = text.lower()
              now = datetime.utcnow()
              best_dt = None
              cn_dates = re.findall(r'(\d{1,2})月(\d{1,2})', text)
              for m_str, d_str in cn_dates:
                  try:
                      dt = datetime(now.year, int(m_str), int(d_str), 17, 0, 0)
                      if not best_dt or dt > best_dt: best_dt = dt
                  except: pass
              return best_dt.strftime('%Y-%m-%dT%H:%M:%SZ') if best_dt else "N/A"

          # ==========================================
          # 2. Steam 核心验证逻辑
          # ==========================================
          def verify_steam_app(app_id):
              if str(app_id) in BLACKLIST: return {"status": "invalid"}
              forced = FORCED_ADD.get(str(app_id))
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res_raw = requests.get(url, headers=HEADERS, timeout=10)
                  d = {}
                  if res_raw.status_code == 200:
                      rj = res_raw.json()
                      if str(app_id) in rj and rj[str(app_id)]['success']: d = rj[str(app_id)]['data']
                  
                  if not d and not forced: return {"status": "invalid"}
                  
                  price = d.get('price_overview', {})
                  is_100 = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))
                  if not is_100 and has_free and price.get('final', 0) == 0 and not is_free: is_100 = True
                  
                  # 判定类型：优先后台手动设定
                  g_type = "100_off"
                  if forced and forced.get('type'): g_type = forced['type']
                  elif is_100: g_type = "100_off"
                  elif (has_free or (not is_free and price.get('final', 0) == 0)): g_type = "weekend"
                  elif is_free: g_type = "to_paid"
                  else: return {"status": "invalid"}

                  title = (forced.get('name') if forced else None) or d.get('name') or f"App {app_id}"
                  img = (forced.get('_custom_thumb') if forced else None) or d.get('header_image')
                  desc = (forced.get('_custom_desc') if forced else None) or d.get('short_description', 'Steam 福利放送')
                  
                  e_date = "N/A"
                  if price.get('discount_expiration'): 
                      e_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  if forced and forced.get('end_date'): e_date = forced['end_date']
                  if e_date == "N/A": e_date = "限免进行中"

                  return {
                      "status": "valid", "type": g_type,
                      "details": {
                          "steam_id": str(app_id), "zh_title": title, "thumbnail": img,
                          "short_description": desc, "end_date": e_date, "platform": "Steam", "type": g_type
                      }
                  }
              except: return {"status": "invalid"}

          # ==========================================
          # 3. Steam 特惠排行榜引擎 (Deals)
          # ==========================================
          def fetch_steam_deals():
              print("🔥 启动全能版 Steam 数据引擎...")
              deals = []
              seen_ids = set()
              try:
                  for page in range(3):
                      url = f"https://store.steampowered.com/search/results/?query&start={page*50}&count=50&specials=1&cc=cn&l=schinese&filter=globaltopsellers"
                      res = requests.get(url, headers=HEADERS, timeout=10)
                      if res.status_code != 200:
                          res = requests.get(f"https://api.allorigins.win/raw?url={urllib.parse.quote(url)}", headers=HEADERS, timeout=15)
                      
                      if res.status_code == 200 and 'data-ds-appid' in res.text:
                          blocks = res.json().get('results_html', '').split('data-ds-appid="')[1:]
                          for b in blocks:
                              try:
                                  aid = b.split('"')[0].split(',')[0]
                                  if aid in seen_ids: continue
                                  title = re.search(r'<span class="title">([^<]+)</span>', b).group(1)
                                  img = f"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/{aid}/header.jpg"
                                  m_pct = re.search(r'-(\d+)%', b)
                                  m_final = re.search(r'discount_final_price">[^0-9]*([\d\.,]+)', b)
                                  if m_pct and m_final:
                                      deals.append({
                                          "id": aid, "name": title, "img": img, 
                                          "discount": int(m_pct.group(1)), "finalPrice": m_final.group(1)
                                      })
                                      seen_ids.add(aid)
                              except: pass
                  # 补充 CCU 和在线人数
                  for d in deals[:50]:
                      try:
                          ccu = requests.get(f"https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid={d['id']}", timeout=5).json()
                          d['peakOnline'] = f"{ccu['response']['player_count']:,} 人" if ccu.get('response', {}).get('result') == 1 else "-"
                      except: d['peakOnline'] = "-"
              except Exception as e: print(f"⚠️ Deals 抓取失败: {e}")
              return deals[:50]

          # ==========================================
          # 4. 主程序：完整 ETL 流程
          # ==========================================
          def main():
              db = {}
              if os.path.exists(DB_FILE):
                  with open(DB_FILE, 'r', encoding='utf-8') as f: db = json.load(f)

              final_games = [] # 100% OFF 列表
              final_intel = {"to_paid": [], "free_weekend": []}
              
              scraped_steam_ids = set(FORCED_ADD.keys())

              # A. 搜刮全网 Steam 福利源
              print("🕵️ 正在全网搜刮 Steam 福利 (Reddit/Keylol/GP)...")
              sources = [
                  "https://www.gamerpower.com/api/giveaways?platform=steam",
                  "https://keylol.com/forum.php?mod=rss&fid=319",
                  "https://www.reddit.com/r/FreeGameFindings/new.json?limit=100"
              ]
              for s in sources:
                  try:
                      r = requests.get(s, headers=HEADERS, timeout=10)
                      scraped_steam_ids.update(re.findall(r'app/(\d+)', r.text))
                  except: pass
              
              # B. 验证 Steam 游戏并归类
              for aid in scraped_steam_ids:
                  res = verify_steam_app(aid)
                  if res['status'] == 'valid':
                      item, g_type = res['details'], res['type']
                      if g_type == "100_off": final_games.append(item)
                      elif g_type == "weekend": final_intel["free_weekend"].append(item)
                      else: final_intel["to_paid"].append(item)
                      db[aid] = res

              # C. 处理 Epic 官方 API 数据
              print("🕵️ 同步 Epic 官方数据并应用拦截器...")
              epic_api = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN"
              try:
                  res = requests.get(epic_api, timeout=10).json()
                  for item in res['data']['Catalog']['searchStore']['elements']:
                      slug = item.get('catalogNs', {}).get('mappings', [{}])[0].get('pageSlug') or item.get('productSlug')
                      if not slug or slug in BLACKLIST: continue
                      
                      # 基础官方数据
                      title = item['title']
                      img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                      desc = str(item.get('description', '')).strip()
                      
                      # ✨ 核心拦截器：如果该游戏在后台有改写，强制覆盖
                      forced = next((f for f in FORCED_EPIC if f['epic_slug'] == slug), None)
                      g_type = "100_off"
                      if forced:
                          if forced.get('zh_title'): title = forced['zh_title']
                          if forced.get('_custom_desc'): desc = forced['_custom_desc']
                          if forced.get('_custom_thumb'): img = forced['_custom_thumb']
                          g_type = forced.get('type', '100_off')

                      promos = item.get('promotions', {})
                      is_up = False
                      e_date = "N/A"
                      if promos.get('promotionalOffers'):
                          off_data = promos['promotionalOffers'][0]['promotionalOffers']
                          if off_data and off_data[0].get('discountSetting', {}).get('discountPercentage') == 0:
                              e_date = off_data[0]['endDate']
                      elif promos.get('upcomingPromotionalOffers'):
                          off_data = promos['upcomingPromotionalOffers'][0]['promotionalOffers']
                          if off_data and off_data[0].get('discountSetting', {}).get('discountPercentage') == 0:
                              e_date = off_data[0]['endDate']
                              is_up = True
                      
                      if e_date != "N/A":
                          game_obj = {
                              "zh_title": title, "thumbnail": img, "short_description": desc,
                              "end_date": (forced.get('end_date') if forced and forced.get('end_date') else e_date),
                              "platform": "Epic Games", "epic_slug": slug, "type": g_type, "is_upcoming": is_up
                          }
                          # 归类
                          if g_type == "100_off": final_games.append(game_obj)
                          elif g_type == "weekend": final_intel["free_weekend"].append(game_obj)
                          else: final_intel["to_paid"].append(game_obj)
              except: pass

              # D. 处理 Epic 上帝模式 (处理那些 API 里没抓到但后台手动加的游戏)
              processed_epic_slugs = {g.get('epic_slug') for g in (final_games + final_intel['to_paid'] + final_intel['free_weekend']) if g.get('epic_slug')}
              for fe in FORCED_EPIC:
                  if fe['epic_slug'] not in processed_epic_slugs and fe['epic_slug'] not in BLACKLIST:
                      # 清洗掉临时字段
                      clean_item = {k: v for k, v in fe.items() if not k.startswith('_')}
                      g_type = fe.get('type', '100_off')
                      if g_type == "100_off": final_games.append(clean_item)
                      elif g_type == "weekend": final_intel["free_weekend"].append(clean_item)
                      else: final_intel["to_paid"].append(clean_item)

              # E. 数据持久化与分发
              print(f"🚀 推送喜加一 (games.json): {len(final_games)} 款")
              post_update("games.json", final_games)
              
              print(f"🚀 推送福利情报 (intel.json)")
              post_update("intel.json", final_intel)
              
              deals = fetch_steam_deals()
              post_update("deals.json", deals)

              with open(DB_FILE, 'w', encoding='utf-8') as f:
                  json.dump(db, f, ensure_ascii=False, indent=2)
              print("✅ ETL 全量业务更新完成！")

          if __name__ == "__main__": main()
          EOF
          python processor.py

      - name: Commit and Push DB
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add steam_db.json games.json intel.json deals.json || true
          git commit -m "Auto Update Full ETL Database [skip ci]" || true
          git pull --rebase origin main || true
          git push
