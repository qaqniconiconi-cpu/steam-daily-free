name: Update Games (GamerPower Integration & Deep Scan)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests

      - name: Run Smart Processor
        run: |
          cat <<EOF > processor.py
          import requests
          import json
          import re
          from datetime import datetime

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)', 'Accept-Language': 'en-US,en;q=0.9'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          API_BASE = 'https://system.et-api.com/v1/get/steam-daily-free'

          def parse_text_date(text):
              months = {"jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12}
              pattern = r'(?:until|ends|before|exp\.|expires|on|starting|after|as\s+of)\s+([a-zA-Z]{3,})\s+(\d+)'
              m1 = re.search(pattern, text, re.IGNORECASE)
              m2 = re.search(r'(?:until|ends|before)\s+(\d+)\s+([a-zA-Z]{3,})', text, re.IGNORECASE)
              
              if m1: m_str, d_str = m1.group(1).lower()[:3], int(m1.group(2))
              elif m2: d_str, m_str = int(m2.group(1)), m2.group(2).lower()[:3]
              else: return "N/A"
                  
              if m_str in months:
                  now = datetime.utcnow()
                  y, m = now.year, months[m_str]
                  if m < now.month - 2: y += 1
                  try: return datetime(y, m, d_str, 17, 0, 0).strftime('%Y-%m-%dT%H:%M:%SZ')
                  except: pass
              return "N/A"

          def get_steam_details(app_id, old_time="N/A"):
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res = requests.get(url, headers=HEADERS, timeout=10).json()
                  if str(app_id) not in res or not res[str(app_id)]['success']: return None
                  d = res[str(app_id)]['data']
                  if d.get('type') != 'game': return None
                  
                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_store_free = d.get('is_free', False)
                  
                  # ⚡ 深度扫描：检查 package_groups 里是否有隐藏的免费授权包 (解决 Deponia 类问题)
                  has_free_package = False
                  for group in d.get('package_groups', []):
                      for sub in group.get('subs', []):
                          if sub.get('is_free_license') == True:
                              has_free_package = True
                              break

                  if not (is_store_free or is_100_off or has_free_package): return None

                  end_date = "N/A"
                  if price.get('discount_expiration'):
                      end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  
                  if end_date == "N/A":
                      try:
                          h = requests.get(f"https://store.steampowered.com/app/{app_id}?l=english", headers=HEADERS, cookies=COOKIES, timeout=5).text
                          if "Free to keep" in h or "100% off" in h: is_100_off = True
                          tm = re.search(r'DiscountEndDate\s*=\s*(\d+)', h) or re.search(r'data-ds-discount-end="(\d+)"', h)
                          if tm: end_date = datetime.fromtimestamp(int(tm.group(1))).strftime('%Y-%m-%dT%H:%M:%SZ')
                          else:
                              ban = re.search(r'game_purchase_discount_countdown[^>]*>([^<]+)<', h) or re.search(r'Free to keep when you get it before([^<]+)', h, re.IGNORECASE)
                              if ban: end_date = parse_text_date(ban.group(1) if ban.lastindex == 1 else "before " + ban.group(1))
                      except: pass

                  if end_date == "N/A" and old_time != "N/A": end_date = old_time
                  
                  return {
                      "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                      "short_description": d.get('short_description', '').strip().split('。')[0],
                      "is_100_off": is_100_off, "end_date": end_date,
                      "is_weekend": has_free_package and not is_100_off and price.get('final', 0) > 0
                  }
              except: return None

          def main():
              memory = {}
              try:
                  for fn in ["games.json", "intel.json"]:
                      old = requests.get(f"{API_BASE}?filename={fn}", timeout=10).json()
                      items = old if isinstance(old, list) else (old.get('to_paid', []) + old.get('free_weekend', []))
                      for i in items:
                          if i.get('steam_id'): memory[i['steam_id']] = i.get('end_date', "N/A")
              except: pass

              ids = set(memory.keys())
              # ⚡ 新增：从 GamerPower API 获取最稳的情报源
              try:
                  gp = requests.get("https://www.gamerpower.com/api/giveaways?platform=steam", timeout=15).json()
                  for g in gp:
                      m = re.search(r'app/(\d+)', g.get('open_giveaway_url', ''))
                      if m: ids.add(m.group(1))
              except: pass

              # 辅助雷达 (Reddit & Keylol)
              try:
                  res = requests.get("https://keylol.com/forum.php?mod=rss&fid=319", timeout=15).text
                  ids.update(re.findall(r'app/(\d+)', res))
              except: pass

              active_games, f_to_paid, f_weekend = [], [], []
              for app_id in ids:
                  info = get_steam_details(app_id, memory.get(app_id, "N/A"))
                  if info:
                      if info['is_100_off']: active_games.append(info)
                      elif info['is_weekend']: f_weekend.append(info)
                      else: f_to_paid.append(info)

              # Epic 部分保持现状... (此处略)

              requests.post("https://system.et-api.com/v1/update/steam-daily-free", headers={"filename": "games.json", "Content-Type": "application/json"}, json=active_games)
              requests.post("https://system.et-api.com/v1/update/steam-daily-free", headers={"filename": "intel.json", "Content-Type": "application/json"}, json={"to_paid": f_to_paid, "free_weekend": f_weekend})

          if __name__ == "__main__": main()
          EOF
          python processor.py
