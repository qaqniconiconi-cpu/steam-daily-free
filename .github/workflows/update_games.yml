name: Update Games (Epic Hidden Radar & Final Fix)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests

      - name: Run Smart Processor
        run: |
          cat <<EOF > processor.py
          import requests
          import json
          import re
          from datetime import datetime

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)', 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'}
          COOKIES = {'birthtime': '283993201', 'wants_mature_content': '1'}
          API_BASE = 'https://system.et-api.com/v1/get/steam-daily-free'

          def parse_date_smart(text):
              months = {"jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12}
              best_dt = None
              cn_dates = re.findall(r'(?:(\d{4})年)?(\d{1,2})月(\d{1,2})[日号]?', text)
              if cn_dates:
                  now = datetime.utcnow()
                  for y_str, m_str, d_str in cn_dates:
                      y = int(y_str) if y_str else now.year
                      m, d = int(m_str), int(d_str)
                      if m < now.month - 2 and not y_str: y += 1
                      try: 
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              m1 = re.findall(r'(?:until|ends|before|exp|on|starting|after|as\s+of)\s+([a-zA-Z]{3,})\s+(\d+)', text, re.IGNORECASE)
              m2 = re.findall(r'(?:until|ends|before)\s+(\d+)\s+([a-zA-Z]{3,})', text, re.IGNORECASE)
              for m_str, d_str in m1:
                  m_s = m_str.lower()[:3]
                  if m_s in months:
                      now = datetime.utcnow()
                      y, m, d = now.year, months[m_s], int(d_str)
                      if m < now.month - 2: y += 1
                      try:
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              for d_str, m_str in m2:
                  m_s = m_str.lower()[:3]
                  if m_s in months:
                      now = datetime.utcnow()
                      y, m, d = now.year, months[m_s], int(d_str)
                      if m < now.month - 2: y += 1
                      try:
                          dt = datetime(y, m, d, 17, 0, 0)
                          if not best_dt or dt > best_dt: best_dt = dt
                      except: pass
              return best_dt.strftime('%Y-%m-%dT%H:%M:%SZ') if best_dt else "N/A"

          def get_steam_details(app_id, old_time="N/A"):
              try:
                  url = f"https://store.steampowered.com/api/appdetails?appids={app_id}&l=schinese&cc=CN"
                  res = requests.get(url, headers=HEADERS, timeout=10).json()
                  if str(app_id) not in res or not res[str(app_id)]['success']: return None
                  d = res[str(app_id)]['data']
                  
                  price = d.get('price_overview', {})
                  is_100_off = price.get('discount_percent') == 100
                  is_free = d.get('is_free', False)
                  has_free_license = any(sub.get('is_free_license') for group in d.get('package_groups', []) for sub in group.get('subs', []))

                  end_date = "N/A"
                  if price.get('discount_expiration'):
                      end_date = datetime.fromtimestamp(int(price['discount_expiration'])).strftime('%Y-%m-%dT%H:%M:%SZ')
                  
                  if end_date == "N/A":
                      try:
                          h = requests.get(f"https://store.steampowered.com/app/{app_id}?l=english", headers=HEADERS, cookies=COOKIES, timeout=5).text
                          if "Free to keep" in h or "100% off" in h: is_100_off = True
                          tm = re.search(r'DiscountEndDate\s*=\s*(\d+)', h) or re.search(r'data-ds-discount-end="(\d+)"', h)
                          if tm: 
                              end_date = datetime.fromtimestamp(int(tm.group(1))).strftime('%Y-%m-%dT%H:%M:%SZ')
                          else:
                              ban = re.search(r'game_purchase_discount_countdown[^>]*>([^<]+)<', h) or re.search(r'Free to keep when you get it before([^<]+)', h, re.IGNORECASE)
                              if ban: 
                                  date_str = ban.group(1) if "before" in ban.group(0).lower() else "before " + ban.group(1)
                                  dt = parse_date_smart(date_str)
                                  if dt != "N/A": end_date = dt
                      except: pass

                  if not (is_free or is_100_off or has_free_license): return None

                  keywords = ["转付费", "收费", "开始收费", "结束免费", "价格调整", "paid", "pricing", "限免", "免费领取", "免费入库", "free to keep", "恢复原价"]
                  
                  if end_date == "N/A":
                      desc_text = d.get('detailed_description', '') + " " + d.get('short_description', '')
                      if any(k in desc_text.lower() for k in keywords):
                          dt = parse_date_smart(desc_text)
                          if dt != "N/A": end_date = dt

                  if end_date == "N/A":
                      try:
                          news_url = f"https://api.steampowered.com/ISteamNews/GetNewsForApp/v0002/?appid={app_id}&count=10"
                          items = requests.get(news_url, timeout=5).json().get('appnews', {}).get('newsitems', [])
                          for item in items:
                              content = item.get('title', '') + item.get('contents', '')
                              if any(k in content.lower() for k in keywords):
                                  dt = parse_date_smart(content)
                                  if dt != "N/A": end_date = dt; break
                      except: pass

                  if end_date == "N/A" and old_time != "N/A": end_date = old_time
                  
                  return {
                      "steam_id": str(app_id), "zh_title": d.get('name'), "thumbnail": d.get('header_image'),
                      "short_description": d.get('short_description', '').strip().split('。')[0],
                      "is_100_off": is_100_off or (has_free_license and price.get('final', 0) == 0),
                      "end_date": end_date,
                      "is_weekend": has_free_license and not is_100_off and price.get('final', 0) > 0
                  }
              except: return None

          def main():
              memory = {}
              try:
                  for fn in ["games.json", "intel.json"]:
                      old = requests.get(f"{API_BASE}?filename={fn}", timeout=10).json()
                      items = old if isinstance(old, list) else (old.get('to_paid', []) + old.get('free_weekend', []))
                      for i in items:
                          if i.get('steam_id'): memory[i['steam_id']] = i.get('end_date', "N/A")
              except: pass

              ids = set(memory.keys())
              
              for url in ["https://store.steampowered.com/api/featuredcategories/", "https://store.steampowered.com/api/featuredcategories/?cc=CN&l=schinese"]:
                  try:
                      res = requests.get(url, timeout=10).json()
                      for cat in res.values():
                          if 'items' in cat: ids.update([str(item['id']) for item in cat['items']])
                  except: pass

              sources = ["https://keylol.com/forum.php?mod=rss&fid=319", "https://www.gamerpower.com/api/giveaways?platform=steam", "https://www.reddit.com/r/FreeGameFindings/new.rss"]
              for s in sources:
                  try:
                      res = requests.get(s, timeout=15).text
                      ids.update(re.findall(r'app/(\d+)', res))
                  except: pass

              active_games, f_to_paid, f_weekend = [], [], []
              for app_id in ids:
                  info = get_steam_details(app_id, memory.get(app_id, "N/A"))
                  if info:
                      if info['is_100_off']: active_games.append(info)
                      elif info['is_weekend']: f_weekend.append(info)
                      else: f_to_paid.append(info)

              # ⚡ 第一步：获取 Epic 官方钦定的每周免费大作
              upcoming_list = []
              epic_urls = ["https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN", "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN"]
              for e_url in epic_urls:
                  try:
                      res = requests.get(e_url, timeout=10).json()
                      for item in res['data']['Catalog']['searchStore']['elements']:
                          promos = item.get('promotions')
                          if not promos: continue
                          mappings = item.get('catalogNs', {}).get('mappings', [])
                          slug = mappings[0].get('pageSlug') if mappings else (item.get('productSlug') or item.get('urlSlug') or "free-games")
                          img = next((i['url'] for i in item.get('keyImages', []) if i['type'] in ['OfferImageWide', 'Thumbnail']), "")
                          
                          # 1. 安全遍历当前限免 (去除了原有的 if/elif 互斥与 [0] 硬编码，完整提取伊松佐河、和睦森林)
                          for active_nodes in promos.get('promotionalOffers', []):
                              for offer in active_nodes.get('promotionalOffers', []):
                                  if offer.get('discountSetting', {}).get('discountPercentage') == 0:
                                      active_games.append({"zh_title": item['title'], "thumbnail": img, "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "Epic 官方限时免费"})
                                      break

                          # 2. 安全遍历即将到来 (战舰世界、电工模拟器等将在此被完整捕获)
                          for upcoming_nodes in promos.get('upcomingPromotionalOffers', []):
                              for offer in upcoming_nodes.get('promotionalOffers', []):
                                  upcoming_list.append({"zh_title": item['title'], "image": img, "start_date": offer['startDate'], "end_date": offer['endDate'], "platform": "Epic Games", "epic_slug": slug, "short_description": "即将开启免费领取"})
                                  break
                      if active_games: break
                  except: continue

              # ⚡ 第二步：启动 Epic 隐藏雷达 (抓取类似 光明斗士 的野生喜加一)
              # 增加 upcoming_list 去重，防止官方预告与第三方重复
              official_epic_slugs = {g.get('epic_slug') for g in active_games + upcoming_list if g.get('epic_slug')}
              try:
                  gp_epic = requests.get("https://www.gamerpower.com/api/giveaways?platform=epic-games-store", timeout=15).json()
                  for g in gp_epic:
                      title = g.get('title', '')
                      if "mystery" in title.lower(): continue 
                      
                      gp_url = g.get('open_giveaway_url')
                      if not gp_url: continue
                      try:
                          actual_url = requests.get(gp_url, timeout=10).url
                          m = re.search(r'store\.epicgames\.com/(?:[a-z]{2}-[a-zA-Z]{2}/)?p/([^/?#]+)', actual_url)
                          if m:
                              slug = m.group(1)
                              if slug in official_epic_slugs: continue
                              
                              img = g.get('thumbnail')
                              end_str = g.get('end_date')
                              end_date = "N/A"
                              
                              # 修复：更强大的日期格式降级容错，确保《光明斗士》这类无时分秒的数据不被误杀
                              if end_str and end_str != "N/A":
                                  try: 
                                      end_date = datetime.strptime(end_str, "%Y-%m-%d %H:%M:%S").strftime('%Y-%m-%dT%H:%M:%SZ')
                                  except: 
                                      try: 
                                          # 降级匹配纯日期格式，并默认补齐至当晚 23:59:59
                                          end_date = datetime.strptime(end_str.split(' ')[0], "%Y-%m-%d").strftime('%Y-%m-%dT23:59:59Z')
                                      except: pass
                              
                              # 核心防御：剔除幽灵数据与常驻免费 (纪念碑谷、Idle Champions等)
                              if end_date == "N/A": continue
                              
                              # 核心防御：剔除已过期游戏
                              try:
                                  if datetime.strptime(end_date, '%Y-%m-%dT%H:%M:%SZ') < datetime.utcnow():
                                      continue
                              except: pass

                              print(f"✅ Found Hidden Epic Game: {title} ({slug})")
                              active_games.append({
                                  "zh_title": title,
                                  "thumbnail": img,
                                  "end_date": end_date,
                                  "platform": "Epic Games",
                                  "epic_slug": slug,
                                  "short_description": "Epic 独立隐藏限免 / 额外赠送"
                              })
                      except: pass
              except: pass

              requests.post("https://system.et-api.com/v1/update/steam-daily-free", headers={"filename": "games.json", "Content-Type": "application/json"}, json=active_games)
              requests.post("https://system.et-api.com/v1/update/steam-daily-free", headers={"filename": "upcoming.json", "Content-Type": "application/json"}, json=upcoming_list)
              requests.post("https://system.et-api.com/v1/update/steam-daily-free", headers={"filename": "intel.json", "Content-Type": "application/json"}, json={"to_paid": f_to_paid, "free_weekend": f_weekend})

          if __name__ == "__main__": main()
          EOF
          python processor.py
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git add *.json || true
          git commit -m "Add Epic Hidden Freebie Radar" || true
          git push
