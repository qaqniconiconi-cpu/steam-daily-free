        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          git add steam_db.json games.json upcoming.json intel.json deals.json || true
          git commit -m "Auto Update ETL Database [skip ci]" || true
          git pull --rebase origin main || true
          git push
